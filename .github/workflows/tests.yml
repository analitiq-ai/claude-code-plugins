name: tests

# One suite for the whole monorepo. `pytest.ini` sets `testpaths = tests packages`,
# so a bare `pytest` runs every plugin's suite (tests/<plugin>/) AND each
# package's own suite (packages/<pkg>/tests/).
#
# What the suites gate:
#   connector_builder/ - three parts, all reading the in-repo contract source so
#     they stay OFFLINE and DETERMINISTIC (no schema fetch), which is what makes
#     them usable as a merge gate:
#       - enum/vocabulary pins: values the plugin restates as decision logic
#         (enum-mappers.md, skill prose, io-contracts.md) must match the
#         contract, including validator ids and resolution scopes;
#       - generated-reference sync: references/rules/*.md is rendered from
#         the contract's rule registry and must not be stale;
#       - example validity: every connector/endpoint under skills/*/examples/
#         must validate, since creator agents copy them as archetypes.
#   pipeline_builder/  - the same problem solved the other way: contract-owned
#     facts are GENERATED into the prose, and the suite fails when a generated
#     block is stale relative to the pin.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only: the suite only checks out and runs pytest - no secrets, no writes.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published packages declare `requires-python = ">=3.10"`. These two
        # are what the plugins are actually exercised on; keep both green so a
        # 3.13-only or 3.12-only regression cannot land silently.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned contract packages
        id: install
        # The pin is VALIDATOR_PIN in
        # plugins/analitiq-pipeline-builder/scripts/_bootstrap.py (see
        # CLAUDE.md "The contract, and the runtime pin"). Never inline a
        # version here; that would be a second copy of a fact one file
        # already owns.
        run: pip install -r requirements-dev.txt
      - name: Run the suites
        id: tests
        # DRIFT_REQUIRE_CONTRACT_MODELS=1 turns a missing/broken contract package
        # into a hard failure instead of an all-skipped green run - this job is a
        # merge gate, so it must never pass without actually running the checks.
        env:
          DRIFT_REQUIRE_CONTRACT_MODELS: '1'
        run: pytest -v -rs
      - name: Check every generated artifact is current
        # scripts/render_all.py owns the generator set and its order; this
        # step runs every generator's check through it, so a generator added
        # there is gated here without editing this file. It runs them all and
        # reports every stale one at once. What each check catches is
        # documented beside its PIPELINE entry and in each script's docstring.
        # Most of these predicates are also computed by a pytest module, so on
        # a stale artifact pytest goes red first and this step is what prints
        # the diff — which is why it runs even after a test failure.
        # Gated on the INSTALL, and `!cancelled()` is load-bearing: an `if:`
        # containing no status-check function gets an implicit `success() &&`
        # prepended, which would skip this step whenever ANY earlier step
        # failed - including the test step, i.e. exactly the runs it exists
        # to explain. No DOMAIN env and no FROM_SOURCE flag: these are
        # repo-root generators that bootstrap the in-repo trees themselves.
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: python3 scripts/render_all.py check
      - name: Package build guards
        # These are what keep the private runtime out of the public wheels:
        # build.py AST-scans for imports outside the set `ALLOWED_THIRD_PARTY`
        # names (it owns that list; restating it here is what goes stale),
        # runs the staged package with `alq` and boto3 absent, and asserts the
        # generated __init__ / PEP 420 layout. The release workflows run them
        # too, but only at tag time - by then a leak is already merged. This is
        # the PR-time gate (it was validator-ci.yml in the infra repo).
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: |
          python3 packages/contract-models/scripts/build.py --check
          python3 packages/validator/scripts/build.py --check

  engine-grammar-pin-guard:
    # The canonical Arrow type vocabulary derives from a VENDORED copy of the
    # engine-published arrow-type-grammar manifest. pytest pins
    # the vendored bytes to the sha256 stated in arrow_grammar.py offline;
    # this job is the network half: the published immutable object at the
    # pinned version must be byte-identical to the vendored copy, each artifact
    # must self-declare the version its pin names, the published
    # conversion-matrix must carry exactly the same family set (read from its
    # `conversions` grid), and a newer engine publication surfaces as a notice
    # (adopting it is a deliberate pin bump, never automatic). The script owns
    # the full semantics; stdlib-only, so no dependency install step.
    #
    # Never add --offline here: it would make this job green having verified
    # nothing about the engine's published truth. test_ci_job_is_wired pins that.
    name: vendored engine grammar matches published manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the vendored grammar against the published objects
        run: python3 scripts/check_engine_grammar_pin.py

  contract-consumption-pin-guard:
    # The reachability census grades every contract field against a VENDORED
    # copy of the engine-published contract-consumption manifest — the fields
    # the engine's run-time path reads. pytest pins the vendored bytes to the
    # sha256 stated in `census/consumption/pin.py` offline; this job is the
    # network half: the published immutable object at the pinned version
    # must be byte-identical to the vendored copy, the manifest must
    # self-declare the version its pin names, and a newer engine publication
    # surfaces as a notice (adopting it is a deliberate pin bump, never
    # automatic). The script owns the full semantics; stdlib-only, so no
    # dependency install step.
    #
    # Never add --offline here: it would make this job green having verified
    # nothing about the engine's published truth. `test_ci_job_is_wired` in
    # `tests/schemas/test_contract_consumption_guard.py` pins that.
    name: vendored consumption manifest matches published object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the vendored consumption manifest against the published object
        run: python3 scripts/check_contract_consumption_pin.py

  pinned-validator-guard:
    # Everything in the pytest job grades the IN-REPO contract source; the
    # plugins' runtime validator is the PUBLISHED wheel behind VALIDATOR_PIN,
    # released on a different train. This is the only gate that exercises that
    # wheel: install it into an isolated venv (never the job env — a wheel
    # shadows the namespace source) and check it accepts the canonical
    # dialect+driver values the connector-builder prose teaches. The failure
    # mode it catches: prose teaching a driver the pinned wheel rejects, which
    # no in-repo test can see. Strict on push — the marketplace's plugin
    # sources are unpinned relative paths, so users install main HEAD and a
    # contradiction on main is live exposure; a release window (pin !=
    # shipped) therefore shows as a red main until the pin catch-up lands, by
    # design — and on release-please branches, where merging stamps a plugin
    # version onto the contradiction. Ordinary PRs inside a window only warn
    # (annotated on the checks UI), so a contract-widening PR is not red with
    # no way to unblock itself. The script owns the full semantics;
    # stdlib-only, so no dependency install step.
    # Live-settings caveat: nothing REQUIRES this check before merge unless a
    # ruleset on main says so, and runs on bot-opened Release PRs start
    # action_required until a human approves them — same settings-page class
    # as the pypi/schemas environments.
    name: pinned validator accepts canonical drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the published pin against the prose canon
        env:
          VALIDATOR_PIN_GUARD_STRICT: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'release-please--')) && '1' || '' }}
        run: python3 scripts/check_validator_pin_contract.py

  contracts-version-guard:
    # `schemas/contracts-version.json` stamps the committed tree's
    # provenance: the analitiq-contract-models version it renders from plus
    # a digest of the tree, so the stamp moves with every render (the render
    # check keeps it current). This job is the network half: the PUBLISHED
    # copy at schemas.analitiq.ai must be byte-identical to the committed
    # stamp, and VALIDATOR_PIN must agree with it — a silently failed
    # schemas publish or a lagging pin surfaces here instead of at a
    # consumer. The script owns the full verdict semantics, windows, and
    # remediation; stdlib-only, so no dependency install step. The
    # strictness expression is identical to pinned-validator-guard's above,
    # and `tests/schemas/test_contracts_version_guard.py` pins them equal.
    name: published contracts-version matches the repo's pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the published provenance stamp against the repo
        env:
          CONTRACTS_VERSION_GUARD_STRICT: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'release-please--')) && '1' || '' }}
        run: python3 scripts/check_contracts_version_pin.py
