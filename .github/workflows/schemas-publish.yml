name: Publish schemas to schemas.analitiq.ai

# Upload the rendered schemas/ tree to the serving bucket behind
# schemas.<DOMAIN>. The bucket and CDN live in the infra repo's Terraform
# (terraform/schemas.tf — "this Terraform owns only the SERVING
# infrastructure"). The publisher IAM role this workflow assumes is specified
# and applied on the infra side, granting list/get/put on the bucket. This
# workflow is the external uploader that Terraform hands the objects to.
#
# Auth is OIDC only — this repo is public and stores no static credential for
# this publish (CLAUDE.md → Releases and credentials). The `schemas` GitHub
# Environment supplies:
#   AWS_ROLE_ARN     assumable role, trust pinned to repo:analitiq-ai/
#                    claude-code-plugins:environment:schemas (variable)
#   AWS_REGION       the bucket's region                     (variable)
#   SCHEMAS_BUCKET   e.g. analitiq-schemas-prod              (variable)
# None are secrets. The environment mirrors the `pypi` reviewer gate
# (required reviewer Analitiq-Bot); its deployment branches permit only
# `main`, where `pypi` permits only release tags.
#
# Publish semantics — the Cache-Control convention matches what the infra
# repo's terraform/schemas.tf documents; the no-delete policy is this
# workflow's own, stated here:
#   * additive — no deletes, ever. Retiring an object is an infra-side call.
#   * pinned versions (X.Y.Z.json) are immutable: uploaded once, never
#     overwritten. First write wins; a re-run byte-compares and skips them,
#     and a pinned file that no longer matches its published object fails
#     the run. That covers data-sync-run-response/1.0.0.json too — hand-
#     authored but VERSIONED, so changing it means renaming to a new triple,
#     never editing in place.
#   * everything else — latest.json, index.json, and every versionless
#     document — is mutable with a short TTL (the upload's cache-control
#     arms below state it). There is no CloudFront invalidation; the short
#     TTL is the only refresh path.
#   * Content-Type follows the served convention: application/schema+json
#     for schema documents, application/json for the index.json manifests,
#     the contracts-version.json provenance stamp, and the data-sync-api
#     OpenAPI doc.
#
# The committed tree is rendered for DOMAIN=analitiq.ai (render_schemas.py
# refuses any other), so this workflow publishes the PROD host's content.
# Publishing to a dev bucket needs the per-environment `$id` host rewrite the
# retired infra uploader performed — out of scope here until the infra side
# settles how a dev bucket gets its own host.
#
# After a failed run, nothing retriggers automatically until the next push
# touching schemas/ — re-publish by hand via workflow_dispatch. Partial
# uploads are safe to re-run: pinned objects skip, pointers re-upload.

on:
  push:
    branches: [main]
    paths: ["schemas/**"]
  # For the initial backfill, re-publishing after environment changes, and
  # recovery after a failed run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schemas-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: schemas
    permissions:
      contents: read
      id-token: write # OIDC token for the assumed AWS role
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        # The dependency set is owned by requirements-dev.txt — never inline a
        # version here (tests.yml states the same rule at its install step).
        run: pip install --quiet -r requirements-dev.txt

      - name: Verify schemas/ is self-consistent
        # tests.yml already gates merges with these; running them again here
        # means a hand-edited tree can't publish even if that gate is
        # bypassed. Coverage, stated precisely: for every registered resource,
        # latest.json and index.json agree with the pinned versions and every
        # bump record justifies the versions it names, every override is one
        # a release would apply, and the generated versionless documents
        # (arrow-types.json and the contracts-version.json provenance stamp)
        # have their render's shape. Whether the models, the grammar and the
        # package version render exactly this tree is the release PR's gate
        # (`check --released`), not this one: main may carry changes the next
        # release has not published yet.
        # The remaining hand-authored files have no content gate in this
        # workflow — data-sync-run-response/1.0.0.json is protected by the
        # first-write-wins byte-compare at upload, data-sync-api/openapi.json
        # only by PR review.
        run: |
          python3 scripts/render_schemas.py check

      - name: Assume the publisher role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload (additive; pinned versions first-write-wins)
        env:
          BUCKET: ${{ vars.SCHEMAS_BUCKET }}
        run: |
          set -euo pipefail
          : "${BUCKET:?SCHEMAS_BUCKET is unset or empty — check the schemas environment variables}"
          uploaded=0 skipped=0
          mutable_cache="public, max-age=300, must-revalidate"
          cd schemas
          expected=$(find . -name '*.json' -type f | wc -l | tr -d ' ')
          # Existence and content for every pinned file come from one bulk
          # pull, so every comparison below is a local `cmp`, never a network
          # round trip. It is a plain command, not a process substitution, so
          # `set -e` actually sees it fail — a sync failure stops the run
          # rather than being read as "nothing is published yet", which would
          # make every pinned file below look new and overwrite it.
          mkdir -p "$RUNNER_TEMP/published"
          aws s3 sync "s3://$BUCKET" "$RUNNER_TEMP/published" --only-show-errors
          while IFS= read -r -d '' f; do
            key="${f#./}"
            case "$(basename "$f")" in
              index.json|openapi.json) ctype="application/json" ;;
              *) ctype="application/schema+json" ;;
            esac
            if [[ "$(basename "$f")" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.json$ ]]; then
              # Immutable pinned version: first write wins, never overwritten.
              # Existence and content both come from the local sync mirror —
              # deliberately not an ETag check (ETags stop being MD5s under
              # multipart uploads or SSE-KMS, and a failed local hash must not
              # read as divergence).
              if [[ -f "$RUNNER_TEMP/published/$key" ]]; then
                if ! cmp -s "$f" "$RUNNER_TEMP/published/$key"; then
                  echo "::error file=schemas/$key::pinned version differs from the published object — publish a new version triple instead of editing $key in place" >&2
                  exit 1
                fi
                skipped=$((skipped + 1))
                continue
              fi
              cache="public, max-age=31536000, immutable"
            else
              cache="$mutable_cache"
            fi
            aws s3 cp "$f" "s3://$BUCKET/$key" \
              --content-type "$ctype" \
              --cache-control "$cache" \
              --no-progress
            uploaded=$((uploaded + 1))
          done < <(find . -name '*.json' -type f ! -name 'contracts-version.json' -print0 | LC_ALL=C sort -z)
          # sort -z (LC_ALL=C): digits < 'i' < 'l', so within each resource the
          # pinned X.Y.Z.json lands before index.json and latest.json — a
          # mid-run failure never leaves a pointer at content that isn't up.
          # contracts-version.json is exempt from the sort for the same
          # reason at tree scope: it is the TREE-WIDE pointer, so it lands
          # dead last, below — a run that dies on any other object leaves the
          # published stamp stale, which is exactly what contracts-version-
          # guard exists to catch; C-sort alone would land it mid-tree.
          if [ "$((uploaded + skipped + 1))" -ne "$expected" ]; then
            echo "::error::processed $((uploaded + skipped)) of $((expected - 1)) non-stamp schema files — the find/loop plumbing is broken" >&2
            exit 1
          fi
          aws s3 cp ./contracts-version.json "s3://$BUCKET/contracts-version.json" --content-type "application/json" --cache-control "$mutable_cache" --no-progress
          uploaded=$((uploaded + 1))
          echo "uploaded=$uploaded skipped-existing-pinned=$skipped"
