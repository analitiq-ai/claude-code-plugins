name: Schema release

# Keeps one release PR open publishing every schema the models changed since
# its last release, each bump decided by the org's shared `schema-bump` tool.
# The OpenRouter key reaches this workflow only: pull-request CI verifies
# the release offline (`tests.yml`, schema-release-guard).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: analitiq-ai/.github/.github/workflows/schema-release.yml@main
    with:
      setup-command: pip install -r requirements-dev.txt
      release-command: python3 scripts/render_schemas.py release
      # tests.yml's schema-release-guard recognises the release PR by this name.
      release-branch: schema-release
    secrets:
      OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
