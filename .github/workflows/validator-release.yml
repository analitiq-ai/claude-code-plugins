name: Publish analitiq-validator

# Build and publish the `analitiq-validator` package to PyPI on a
# `validator-vX.Y.Z` tag, via OIDC Trusted Publishing (no stored token).
#
# packages/validator/scripts/build.py stages packages/validator/src verbatim as
# the public `analitiq.validator` package, which depends on
# `analitiq-contract-models` by exact version from PyPI. Consumers (the
# connector-builder plugin, the registry CI) `pip install analitiq-validator`
# and run the `analitiq-validate` console script.
#
# Runbook — the tag is pushed at the PR head, BEFORE the merge, so main is only
# ever updated to a version already on PyPI. Root CLAUDE.md "Releases" owns the
# full sequence; the short form:
#   1. One PR bumps every coupled value (this pyproject's `version`, the
#      contract-models `==` dep, VALIDATOR_PIN, the connector agent's
#      self-install line). `pinned-validator-guard` is red until step 3.
#   2. Push a tag matching that version at the PR head: `validator-v1.0.0rc2`.
#      Checkout below resolves the tag, so the commit need not be on main yet.
#   3. This workflow asserts tag == pyproject version, runs the validator's own
#      test suite, builds sdist+wheel from the staged package, installs that
#      wheel beside a contract-models wheel built from the same commit and
#      grades every shipped rule case against it, and publishes.
#   4. Re-run `pinned-validator-guard` (now green), then merge with a MERGE
#      COMMIT — squashing would orphan the commit this tag points at.
#
# PyPI versions are immutable (single-use): iterate with pre-release suffixes
# (rc1, rc2, ...) and cut the final X.Y.Z once.
#
# Required PyPI Trusted Publisher (pypi.org -> project -> Publishing -> Add):
#   Owner: analitiq-ai   Repository: claude-code-plugins
#   Workflow name: validator-release.yml   Environment: pypi
# Tag-triggered only. These packages are deliberately NOT managed by
# release-please: it speaks SemVer and their versions are PEP 440 pre-releases
# (1.0.0rc12), which it resolves as plain 1.0.0 and then bumps - dropping the rc
# suffix and jumping the train to a final release. Push the tag by hand.
#
# A human-pushed tag triggers this normally. A tag created by the release-please
# action would NOT: GitHub suppresses workflow triggers from GITHUB_TOKEN to
# prevent loops. That is why no publish job can be wired to release-please
# output, and the second reason these stay manual.
on:
  push:
    tags:
      - "validator-v*"

permissions:
  contents: read

concurrency:
  group: validator-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The PyPI Trusted Publisher for this project is registered with
    # `Environment name: pypi`. PyPI checks the environment on its side, so a job
    # WITHOUT this key is rejected at the publish step of an otherwise green run.
    # The environment also restricts which tags may deploy. Do not remove it
    # without editing the publisher on PyPI to match.
    environment: pypi
    permissions:
      # A job-level permissions block REPLACES the workflow-level one (unspecified
      # perms become `none`), so `contents: read` must be re-granted here or
      # actions/checkout can't read the repo and the publish never builds.
      contents: read
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derive release version from tag
        id: ver
        # build.py --expect-version cross-checks this against pyproject.toml, so
        # a mistyped tag fails before anything is published.
        # Shell parameter expansion, not an Actions expression — `${{ ... }}`
        # here is a workflow-file parse error that fails every trigger at startup.
        run: echo "version=${GITHUB_REF_NAME#validator-v}" >> "$GITHUB_OUTPUT"

      - name: Install build + test tooling
        # `jsonschema` is a declared validator dependency (it meta-validates the
        # JSON-Schema documents embedded in api-endpoints as Draft 2020-12); the
        # test suite exercises that path, so it must be present here just as in
        # tests.yml's PR-time gate. Kept in lockstep with its install step.
        run: pip install --quiet build "pydantic>=2.12,<3" "jsonschema>=4.18,<5" "referencing>=0.30" pytest

      - name: Build guards (version match, public-safe imports)
        run: python packages/validator/scripts/build.py --check --expect-version "${{ steps.ver.outputs.version }}"

      - name: Validator tests — never ship a validator that fails its own suite
        run: python -m pytest -q packages/validator/tests

      - name: Stage the public package
        run: python packages/validator/scripts/build.py --dist "${{ runner.temp }}/v-src"

      - name: Build sdist + wheel
        run: python -m build --outdir "${{ runner.temp }}/v-dist" "${{ runner.temp }}/v-src"

      - name: Build the contract-models wheel the smoke test installs beside it
        # The validator pins `analitiq-contract-models` exactly, so the smoke
        # test installs the one built from this same commit rather than
        # resolving it from PyPI.
        run: |
          python packages/contract-models/scripts/build.py --dist "${{ runner.temp }}/cm-src"
          python -m build --wheel --outdir "${{ runner.temp }}/cm-dist" "${{ runner.temp }}/cm-src"

      - name: Smoke-test the built wheel (install + grade every shipped rule case)
        # build.py stages every tracked file whatever package-data says, so
        # only an install of the actual wheel shows what the declaration kept
        # — and a broken rc published to PyPI is an immutable, burned version.
        # The data-file check is DERIVED from the staged tree rather than
        # listing filenames, so a case committed later is covered without
        # anyone remembering this step.
        run: |
          python -m venv "${{ runner.temp }}/v-smoke"
          "${{ runner.temp }}/v-smoke/bin/pip" install --quiet "${{ runner.temp }}"/v-dist/*.whl "${{ runner.temp }}"/cm-dist/*.whl
          STAGED="${{ runner.temp }}/v-src" DIST="${{ runner.temp }}/v-dist" "${{ runner.temp }}/v-smoke/bin/python" -c "
          import os, pathlib, tarfile, zipfile
          import analitiq.validator as v
          from analitiq.validator.rule_cases import case_mismatch, rule_cases

          staged = pathlib.Path(os.environ['STAGED']) / 'src' / 'analitiq' / 'validator'
          installed = pathlib.Path(v.__file__).parent
          expected = sorted(
              p.relative_to(staged)
              for p in staged.rglob('*')
              if p.is_file() and p.suffix not in ('.py', '.pyc')
              and '__pycache__' not in p.parts
          )
          assert expected, 'staged tree carries no data files — the walk broke'
          missing = [str(r) for r in expected if not (installed / r).is_file()]
          assert not missing, f'wheel dropped staged data files: {missing}'
          print('data files shipped:', len(expected))

          # The installed tree carries the bytecode pip compiles, so bytecode
          # the build host left in the staged tree shows only in the archives.
          dist = pathlib.Path(os.environ['DIST'])
          archived = [n for w in dist.glob('*.whl') for n in zipfile.ZipFile(w).namelist()]
          archived += [n for s in dist.glob('*.tar.gz') for n in tarfile.open(s).getnames()]
          bytecode = [n for n in archived if n.endswith('.pyc') or '__pycache__' in n]
          assert not bytecode, f'build-host bytecode shipped: {bytecode}'

          cases = rule_cases()
          assert cases, 'rule case corpus shipped empty'
          mismatches = [m for m in map(case_mismatch, cases) if m]
          assert not mismatches, mismatches
          print('rule cases graded:', len(cases))
          "

      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/v-dist
          print-hash: true
