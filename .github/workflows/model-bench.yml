name: Model bench (throwaway)

on:
  push:
    branches: [chore/model-bench-throwaway]

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 258
            model: z-ai/glm-5.3-flash
          - pr: 260
            model: z-ai/glm-5.3-flash
          - pr: 270
            model: moonshotai/kimi-k2.6
    runs-on: ubuntu-latest
    env:
      OR_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run one (pr=${{ matrix.pr }}, model=${{ matrix.model }})
        run: |
          SAFE_MODEL=$(echo "${{ matrix.model }}" | tr '/.:' '_')
          bash .bench/scripts/run-one.sh ".bench/diffs/pr${{ matrix.pr }}.diff" "${{ matrix.model }}" "/tmp/result_pr${{ matrix.pr }}_${SAFE_MODEL}.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: diag-pr${{ matrix.pr }}-${{ strategy.job-index }}
          path: /tmp/result_*.json
          retention-days: 3
