name: Secret Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    # The gitleaks CLI is MIT-licensed and needs no key; gitleaks/gitleaks-action
    # requires a GITLEAKS_LICENSE secret for repos owned by an organization.
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the PR's commit range (base..head) is resolvable.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Only the commits this PR introduces: a secret already in history is out
      # of scope for the merge gate. gitleaks exits 1 on a finding.
      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA} --no-merges" \
            --redact --no-banner --verbose
