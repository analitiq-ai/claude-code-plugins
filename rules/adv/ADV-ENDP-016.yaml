id: ADV-ENDP-016
statement: >
  An idempotency key's name MUST NOT collide with any header the same write
  request declares, nor with any field of the body it resolves to.
tier: advisory
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::WriteOperation._wiring"
owners: [connector-plugin, engine]
targets: [WriteOperation]
rationale: >
  The endpoint declares only where the key goes; the value is generated per
  record and owned by the engine. A header or body field authored under the same
  name puts a second writer on that slot, and whichever wins, the provider stops
  seeing a stable key across retries — it treats each attempt as new and writes
  the record twice, which is the exact failure the key was declared to prevent.
  The check is a name collision only: a hand-authored key under a different name
  is indistinguishable from an ordinary field and stays unmechanized.
status: active
superseded_by: null
