id: ADV-CTOR-019
statement: >
  A `resource_discovery.produces` entry MUST name an artifact kind the
  contract's vocabulary admits, and discovery MUST write nothing outside it.
tier: structural
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::ResourceDiscovery.produces"
owners: [engine, connector-plugin]
targets: [ResourceDiscovery]
fields: [produces]
mechanism: literal_enum
rationale: >
  `produces` is the declared blast radius of a discovery run: the runtime
  writes the artifact kinds it names and nothing else, so a kind outside the
  vocabulary is an instruction nothing will carry out. Keeping the set closed
  is also what keeps discovery output connection-scoped — a run cannot grow
  into writing artifacts the connector release is supposed to own, which is the
  boundary that makes discovered endpoints safe to regenerate. The membership
  half is carried by the model's shape, so an unknown kind is rejected against
  the field.
status: active
superseded_by: null
