id: ADV-ENDP-002
statement: >
  A parameter declared as controlled by pagination or replication MUST NOT also
  declare the operator set that makes it stream-filterable.
tier: structural
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::Param._validate"
owners: [connector-plugin, engine]
targets: [Param]
rationale: >
  The operator set is the endpoint's promise that a downstream stream may filter
  on that param; marking the param controlled hands its value to the paging or
  incremental machinery, which sets it on every request. Declaring both
  advertises a filter the runtime overwrites, so the stream's predicate vanishes
  from the request and the run reports success over unfiltered data. Rejudged
  structural: it is a conditional on the shape of one param object, mirrored
  declaratively into the published schema, not an instance-relative comparison.
status: active
superseded_by: null
