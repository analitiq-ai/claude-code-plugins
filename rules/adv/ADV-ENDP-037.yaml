id: ADV-ENDP-037
statement: >
  A predicate MUST be tagged by exactly one operator key, and that key MUST be
  one the contract's predicate union tags.
tier: structural
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::PredicateEq"
owners: [connector-plugin]
data:
  targets: [PredicateEq, PredicateNeq, PredicateLt, PredicateLte, PredicateGt, PredicateGte, PredicateExists, PredicateMissing, PredicateEmpty, PredicateNotEmpty, PredicateAnd, PredicateOr, PredicateNot]
  mechanism: discriminated_union
rationale: >
  The operator key is the discriminator: it selects the branch that says what
  operands the predicate takes, so an object carrying two of them, or one the
  union does not tag, has no defined shape to check its operands against. Left
  open, a misspelled operator would read as a valid predicate that simply never
  holds — and the two places predicates are used are the ones where "never
  holds" is silent and expensive: a `stop_when` that stops paging after the
  first page, and a `success_when` that reports a rejected write as a success.
status: active
superseded_by: null
