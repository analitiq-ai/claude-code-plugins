id: ADV-STRM-021
statement: >
  A validation rule's value MUST carry the payload shape its type requires.
tier: advisory
severity: error
scope: stream
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
targets: [ValidationRule]
rationale: >
  The value field is deliberately typed open so each rule type can carry its
  own payload — a bound, a regex, a range object, a list of admitted values
  — and that openness is what leaves the shape unchecked: a rule whose
  payload is the wrong kind validates here and fails only when the rule runs
  against a record, mid-transfer, on data the author is not looking at. The
  sibling rule settles only whether a payload is present, so an author who
  reads a clean validation as confirmation of the payload has read too much
  into it. Catching a violation means reading each rule's type against the
  meaning of its type in the stream spec.
status: active
superseded_by: null
