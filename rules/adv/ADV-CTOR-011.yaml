id: ADV-CTOR-011
statement: >
  Every placeholder in a url_template DSN MUST have a binding, and every
  binding MUST be referenced by the template.
tier: advisory
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::UrlTemplateDsn._validate_placeholder_bindings"
owners: [engine, connector-plugin]
targets: [UrlTemplateDsn]
rationale: >
  Template and bindings are edited apart, and both directions of a mismatch are
  quiet. An unbound placeholder renders a DSN with a literal brace in it, which
  the driver rejects as an unparseable URL somewhere far from the connector. An
  unreferenced binding is a value the author believed was reaching the
  connection — very often a credential — that is resolved and then dropped.
  Correspondence in both directions is what makes the DSN readable as one
  thing.
status: active
superseded_by: null
