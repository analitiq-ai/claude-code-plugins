id: ADV-CTOR-017
statement: >
  A bulk-load family key MUST name a mechanism the contract admits under that
  family — the families' vocabularies differ, so a mechanism is declarable only
  under the family whose field carries it — and a mechanism outside them is not
  declarable at all.
tier: structural
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::SqlBulkLoad.sqlalchemy"
owners: [engine, connector-plugin]
data:
  targets: [SqlBulkLoad]
  fields: [sqlalchemy, adbc]
  mechanism: literal_enum
rationale: >
  A bulk mechanism is a fact about a transport, not about the connector: one
  needs the driver's raw wire connection, another an ADBC cursor. Pairing a
  mechanism with a family that cannot run it would declare a landing path the
  engine can never take, so the vocabularies are split per family to make the
  unrunnable pairing unrepresentable at parse time instead of something checked
  after a write already failed. The declaration is also what obliges the
  dialect hook that implements the mechanism, and that pairing is enforced
  somewhere this document cannot see — the conformance kit, against the
  connector's Python package.
status: active
superseded_by: null
