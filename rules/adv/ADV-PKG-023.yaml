id: ADV-PKG-023
statement: >
  A connector's write direction MUST live in `type-map-write.json`: the
  package ships no Python type-rendering table, and a `render_column_type`
  override exists only for logic the map's rules cannot express, delegating
  every other type back to the map.
tier: structural
severity: warning
scope: connector-package
mechanized: false
validator: null
owners: [connector-plugin, engine]
data: {}
rationale: >
  Every transport renders column types through that one hook, whose default
  is the write map, so a rendering table transcribed into Python quietly
  takes over the direction the map is validated for — the map's coverage
  warnings then grade a document nothing reads, and the two drift apart
  from the first new type onward. Code feels like the natural home for
  parameterised rendering, which is why the map has substitution rules at
  all. Nothing here can tell a delegating override from a full table: the
  map is a document this repo validates and the override is Python it never
  sees, and the conformance kit audits the override surface, not what a
  hook computes.
status: active
superseded_by: null
