id: ADV-ENDP-028
statement: >
  A `from_param` path_params binding on a write operation MUST name a param
  that declares a default.
tier: advisory
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::WriteOperation._wiring"
owners: [connector-plugin, engine]
data:
  targets: [WriteOperation]
  kind: custom
rationale: >
  The other things that fill a param are read-side: operators make it
  filterable from a stream, and controlled_by hands it to pagination or
  replication. Neither is reachable from a write, so a write param with no
  default has provably no source, and the placeholder it fills can never be
  substituted — a document that validates and is dead at the first request.
  The shape used to be contract-valid, which is why it is worth refusing
  explicitly rather than leaving to discovery at run time; the diagnostic
  names the two ways out, giving the param a default or binding the segment
  to the record instead. Reads keep the latitude, because there a stream
  filter can supply the value.
status: active
superseded_by: null
