id: ADV-CTOR-015
statement: >
  A transport family that lands through the default path MUST be omitted from
  the bulk-load declaration rather than declared with a null mechanism.
tier: advisory
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::SqlBulkLoad._null_is_not_a_mechanism"
owners: [engine, connector-plugin]
data:
  targets: [SqlBulkLoad]
rationale: >
  Absence of a family key already means "this family lands via executemany", so
  a null mechanism is a second spelling of the same fact — and the engine's
  typed parser refuses it, turning a connector that validated as complete into
  one refused at handshake. Keeping absence the only "none" also holds in the
  emit direction: a plain dump of a parsed connector would otherwise write back
  the explicit null the contract itself rejects.
status: active
superseded_by: null
