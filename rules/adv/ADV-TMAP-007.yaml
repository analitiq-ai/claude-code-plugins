id: ADV-TMAP-007
statement: >
  A `${` opening a placeholder in a canonical render MUST be closed around a
  non-empty name.
tier: structural
severity: error
scope: type-map
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/type_map.py::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
data:
  targets: [TypeMapReadRegexRule]
rationale: >
  A malformed placeholder names no capture, so substitution leaves it in place
  and the rule renders a canonical carrying literal `${` text that no Arrow
  parser accepts. Nothing about the surrounding string looks wrong, and the
  well-formedness check is what lets the capture-backing check above it read
  the render at all.
status: active
superseded_by: null
