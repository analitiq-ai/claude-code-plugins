id: ADV-CTOR-013
statement: >
  A stage placed in a schema of its own MUST name that schema, and a stage
  co-located with the target MUST NOT name one.
tier: advisory
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::SqlStageCapabilities._dedicated_schema_matches_scope"
owners: [engine, connector-plugin]
data:
  targets: [SqlStageCapabilities]
  kind: custom
rationale: >
  The engine emits the staging schema as a SQL identifier when it creates and
  drops the stage relation around every write. A dedicated placement with no
  name leaves it nowhere to create the stage, and the write fails at handshake
  rather than in the document. A name carried alongside a co-located placement
  is worse than dead: it reads as though stages live somewhere they do not,
  which is exactly the misreading that makes a real-scope stage get addressed
  as a bare table name and land in whatever schema the session defaults to.
  This conditional pairing is also why the name is never in the block's
  required set.
status: active
superseded_by: null
