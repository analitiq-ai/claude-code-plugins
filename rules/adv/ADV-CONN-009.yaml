id: ADV-CONN-009
statement: >
  A connection MUST NOT carry a secret value; an input the connector routes to
  secret storage is authored as a pointer in `secret_refs`.
tier: referential
severity: error
scope: connection
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
targets: [ConnectionAuthored, ConnectionInput]
rationale: >
  The document is committed alongside the pipeline, so an embedded credential
  is a leaked credential and replacing it means rewriting history rather than
  rotating a secret. Part of this is caught: the pointer grammar rejects a bare
  token in `secret_refs`, and `ADV-CONN-004` rejects credential-shaped keys in
  the non-secret maps. What is not caught is the part that needs the connector:
  which inputs are secret at all is declared there, and nothing inspects a
  value for *being* a secret, so a real key filed under an innocuous name
  validates cleanly everywhere and is discovered by whoever reads the repo.
status: active
superseded_by: null
