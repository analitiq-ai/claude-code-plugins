id: ADV-ENDP-006
statement: >
  Every node of a write mode's input schema that declares either the native
  type or the canonical Arrow type MUST declare both, and MUST carry the
  sibling declarations its container form requires.
tier: advisory
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::WriteInput._validate"
owners: [connector-plugin, engine]
data:
  targets: [WriteInput]
  kind: custom
rationale: >
  The input schema is the only description of the record being written: the
  write type map is matched against its native tokens, and every record-addressed
  binding and conflict key is resolved against its declared fields. A half-typed
  node makes the engine infer the canonical type of a value it is about to send,
  and an untraversable container makes a per-field binding into that record
  unresolvable — both surface as a provider-side rejection or a silently wrong
  value, not as an authoring error.
status: active
superseded_by: null
