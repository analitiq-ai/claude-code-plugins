id: ADV-DBEP-003
statement: >
  Every name in a database endpoint's `primary_keys` MUST name a column the
  same document declares.
tier: advisory
severity: error
scope: database-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::DatabaseEndpointDoc._primary_keys_name_columns"
owners: [pipeline-plugin, engine]
data:
  targets: [DatabaseEndpointDoc]
  fixture_model: DatabaseEndpointDoc
rationale: >
  The key list is what an upsert stream draws its conflict keys from and what
  the engine emits into the table it creates, so a key naming a column that is
  not in the document fails at DDL render, or matches nothing at merge time and
  turns an upsert into unbounded inserts. The usual cause is carrying a
  source's key list onto a destination whose column set was narrowed — the keys
  are copied from one document and the columns from another, and only the
  endpoint holds both.
status: active
superseded_by: null
