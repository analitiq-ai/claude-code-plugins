id: ADV-CTOR-001
statement: >
  A connector's default_transport MUST name a transport the same document
  declares.
tier: advisory
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/shared/advisory.py::_check_member_of"
owners: [engine, connector-plugin]
data:
  targets: [ConnectorBase]
  fields: [default_transport, transports]
  kind: member_of
  fixture_model: ApiConnector
rationale: >
  The default transport is what every operation that declares no transport_ref
  runs on, so a name with nothing behind it fails at connect time on a document
  that read as complete. The usual cause is a transport renamed on one line and
  not the other: the two keys sit far apart in the file, and nothing about
  either one on its own looks wrong.
status: active
superseded_by: null
