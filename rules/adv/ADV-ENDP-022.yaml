id: ADV-ENDP-022
statement: >
  An expression dict in a request slot MUST declare exactly one expression
  key and carry no sibling beyond the argument fields that key itself
  declares and extension keys.
tier: structural
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::ReadOperation._wiring"
owners: [connector-plugin, engine]
data:
  targets: [ReadOperation, WriteOperation]
rationale: >
  The resolver dispatches on the one key it recognises, in its own
  precedence order, and ignores whatever else the dict carries. So a dict
  declaring two of them resolves through one and silently discards the
  other — the author reads the ref they wrote, the wire carries the literal
  beside it — and a stray sibling is an author's edit that never took
  effect. Request slots are untyped, so nothing else in the contract sees
  these dicts; refusing the malformed shape at its own site is also what
  keeps the failure pointing at the bad fragment instead of surfacing later
  as a misleading "param not referenced" from the binding walk.
status: active
superseded_by: null
