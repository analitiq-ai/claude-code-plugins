id: ADV-STRM-024
statement: >
  An API destination's write mode MUST be one the referenced api-endpoint
  document declares a write operation for.
tier: referential
severity: error
scope: stream
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
targets: [ApiWrite]
rationale: >
  The model bounds the mode to the contract's write vocabulary, but which of
  those an endpoint actually implements is a fact in the endpoint document
  the stream only references — so a mode the provider has no operation for
  validates locally and has nothing to execute. The vocabulary being closed
  is what makes this easy to miss: an author picks a member, the validator
  accepts it, and the narrowing that mattered was never in view. Catching a
  violation means opening the referenced endpoint and reading which write
  operations it declares.
status: active
superseded_by: null
