id: ADV-ENDP-039
statement: >
  A write operation's `idempotency` MUST declare only where the provider's key
  is placed, from the placement vocabulary `Idempotency.location` carries, and
  MUST NOT carry anything that produces the key's value.
tier: structural
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::Idempotency.location"
owners: [connector-plugin, engine]
targets: [Idempotency]
fields: [location]
mechanism: literal_enum
rationale: >
  An idempotency key only works if a retry of the same record carries the same
  value, and only the engine is positioned to guarantee that — it derives the
  key from the record's content and replays it on the retry. Admitting a value
  expression here would put an engine-computed quantity into the request
  grammar, and every expression an author could write is wrong in one of two
  directions: one that varies per attempt defeats the retry, one that is
  constant across records collapses distinct writes into a single provider-side
  operation. So the declaration carries a placement and a name, which are the
  parts the provider decides, and nothing that yields a value.
status: active
superseded_by: null
