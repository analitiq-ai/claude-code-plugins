id: ADV-PIPE-010
statement: >
  The order of a pipeline's `streams` MUST NOT encode a dependency between
  streams, and MUST NOT be presented to the user as one.
tier: procedural
severity: error
scope: pipeline
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
data:
  targets: [PipelineAuthored]
rationale: >
  Every permutation validates identically and the runtime is free to ignore
  the order entirely, so an array arranged to mean "load the dimensions before
  the facts" produces wrong results non-deterministically, and nothing can
  tell that arrangement from an arbitrary one. The second half of the rule
  carries as much weight as the first: a user told the order is meaningful
  will go on authoring against a guarantee that does not exist, long after the
  document that misled them is forgotten.
status: active
superseded_by: null
