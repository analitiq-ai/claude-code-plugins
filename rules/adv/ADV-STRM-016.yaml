id: ADV-STRM-016
statement: >
  A stream destination's write block MUST take the shape its mode selects
  and carry only the fields that shape declares.
tier: structural
severity: error
scope: stream
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/stream.py::DatabaseKeylessWrite"
owners: [pipeline-plugin]
data:
  targets: [DatabaseKeylessWrite, DatabaseConflictKeyedWrite, ApiWrite]
  mechanism: discriminated_union
rationale: >
  The conflict target is only meaningful where the write resolves a
  conflict, so making it a field of that one shape means an author cannot
  attach it to a write that would ignore it, and cannot omit it from a write
  that needs it. The rejection names the field rather than this rule, which
  is why the id is worth citing beside prose that teaches the choice: the
  error arrives as an unknown or missing key and reads as a typo rather than
  as the wrong write shape. An API upsert's conflict target is endpoint-
  owned, so the field would be a second, contradictory declaration there.
status: active
superseded_by: null
