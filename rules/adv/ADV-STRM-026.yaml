id: ADV-STRM-026
statement: >
  A filter on an API source MUST name a read parameter the referenced
  endpoint declares filterable — one that publishes its own operator set and
  is not reserved to the runtime.
tier: referential
severity: error
scope: stream
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
targets: [Filter]
rationale: >
  Filterability is declared per parameter in the api-endpoint document and
  the stream carries no view of it, so the local check can prove only that
  an operator is in the API vocabulary at all; the registry compares the
  filter against that parameter's own subset on save. Two failures hide
  here and look alike: a parameter that is filterable but does not accept
  this operator, and a parameter the runtime owns — a pagination or
  replication control — that the stream must not drive at all. Catching
  either means reading the parameter's declaration in the endpoint document.
status: active
superseded_by: null
