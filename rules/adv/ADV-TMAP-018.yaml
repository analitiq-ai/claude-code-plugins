id: ADV-TMAP-018
statement: >
  A connection-scoped type map MUST declare a rule only for a native or
  canonical its connector's own map leaves unresolved.
tier: referential
severity: error
scope: type-map
mechanized: false
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
data: {}
rationale: >
  The engine composes the connection map as primary over the connector map by
  concatenating the two rule lists into one first-match list, so a connection
  rule repeating something the connector already covers does not sit
  harmlessly beside it — it replaces the connector's rendering for every stream
  on that connection, including streams nobody was editing. An author closing a
  discovery gap has the connector's rules in front of them and it costs nothing
  to restate one, which is exactly how the override happens by accident.
  Nothing validating a connection map can see the connector's: they are
  separate documents joined only at resolution time, so catching a shadow means
  resolving each authored probe against the connector map first — what the gap
  helper does and no validator does.
status: active
superseded_by: null
