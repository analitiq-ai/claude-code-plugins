id: RULE-CTOR-043
statement: >
  An `api` connector's release MUST NOT carry connector-package Python files.
tier: referential
severity: warning
scopes: [connector]
validator: null
owners: [connector-plugin, engine]
rationale: >
  An API connector runs on the engine's generic class for its kind, so
  package files beside it are not a lighter version of a database
  connector's — they are files nothing loads, and their presence almost
  always means the system was reclassified as an API after being authored as
  a database, leaving a dialect that describes a transport this connector no
  longer has. The absence of a file is a property of the release directory
  rather than of any document: the validator checks which type maps a
  connector ships but never looks for package files, so an `api` connector
  carrying a dialect passes every check here.
status: active
superseded_by: null
