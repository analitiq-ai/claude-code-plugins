id: RULE-STRM-006
statement: >
  An arrow field spec MUST declare the inner shape its arrow_type calls for
  and no other: a container marker carries its own inner declaration, and
  any other type carries none.
tier: advisory
severity: error
scopes: [stream]
validator: "analitiq.contracts.stream::ArrowFieldSpec._validate_container_shape"
owners: [pipeline-plugin]
targets: [ArrowFieldSpec]
fields: [arrow_type, properties, items]
rationale: >
  The container markers are the only place the authored shape says anything
  about nested data, so a marker without its inner declaration describes a
  container with unknown contents, and an inner declaration beside a scalar
  describes nesting the type cannot hold — a shape that contradicts itself
  before anything consumes it. The declared sub-tree reaches a run inside
  the assignment target it sits on, which the pinned contract-consumption
  manifest consumes whole rather than field by field, so the contradiction
  is caught where the shape is graded field by field: at validation. The
  same chokepoint serves endpoint columns and stream mapping alike, so a
  shape accepted here would have to be accepted there too.
status: active
superseded_by: null
