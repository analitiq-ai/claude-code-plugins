id: RULE-CTOR-042
statement: >
  The directory a connector release ships as MUST be named for the
  `connector_id` its `connector.json` declares.
tier: reference
severity: error
scopes: [connector]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, engine]
rationale: >
  That slug is the connector's identity in three places at once — the
  registry path the contract builds, the entry-point name the engine resolves
  the connector class by, and the directory itself — so a directory renamed
  for readability detaches the package from the document describing it and
  the engine silently falls back to the generic class for the kind. The
  directory is invisible to a single-document validation run: no contract
  model sees the path, and the validator resolves siblings relative to
  whatever path it was handed rather than comparing that path's name to
  `connector_id`. Known enforcement gap at registry CI too, for the same
  reason `RULE-PKG-002`'s repository-root layout is: every documented CI
  step (the wheel build, entry-point resolution, the conformance kit) reaches
  the package through its installed distribution, never the release
  directory's own name, so a rename that leaves the document, package
  mapping and entry points internally consistent passes every one of them.
status: active
superseded_by: null
