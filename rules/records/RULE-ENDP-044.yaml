id: RULE-ENDP-044
statement: >
  A keyset pagination block MUST omit `initial` when there is no first-page key,
  and MUST NOT spell that absence as an explicit null.
tier: shape
severity: warning
scopes: [api-endpoint]
validator: "analitiq.validator.connectors::_keyset_initial_null_findings"
owners: [connector-plugin]
targets: [Keyset]
rationale: >
  Omission is how the block says "send no keyset on the first request"; a null
  is a value, so a document writing one is claiming a first-page key that
  happens to be null. Today the two behave alike, which is exactly why it goes
  unnoticed and why it is not yet a broken run — but the document has lost the
  distinction, and it stays lost until something needs it: a provider whose
  first key genuinely is null, or a stricter reading of the field. Checked in
  `analitiq.validator` rather than by a `@model_validator` on `Keyset` itself:
  this rule's declared severity is `warning`, and a model-level refusal always
  surfaces as an `error`-severity finding regardless of what a record
  declares, so a `warning`-severity rule must be a validator check instead.
status: active
superseded_by: null
