id: RULE-PKG-027
statement: >
  A connector package's `requirements.txt` MUST pin the driver distribution
  each transport its `connector.json` declares needs — the DBAPI named by a
  SQLAlchemy transport's `dialect+driver`, and the `adbc-driver-{driver}`
  wheel plus `adbc-driver-manager` for an ADBC transport's `driver` — and
  nothing else, neither an engine pin nor the CDK the engine environment
  provides.
tier: referential
severity: error
scope: connector-package
mechanized: false
validator: null
owners: [connector-plugin, engine]
rationale: >
  The engine image ships no database drivers, so this file is the only
  place a connector's driver is pinned and a missing or wrong distribution
  means the connector cannot connect at all — while a stray engine pin or a
  CDK entry fights the environment the connector is installed into.
  `requirements.txt` is a package file no contract model sees, so nothing
  here can check that what it pins is what the sibling `connector.json`'s
  declared transport actually imports at run time; registry CI installs
  whatever is listed without knowing what was needed.
status: active
superseded_by: null
