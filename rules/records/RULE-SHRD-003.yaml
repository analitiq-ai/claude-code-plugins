id: RULE-SHRD-003
statement: >
  Every document a plugin authors MUST declare `$schema` with the published
  canonical URL for its family, including the families whose contract leaves
  the field optional.
tier: shape
severity: warning
scopes: [any]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, pipeline-plugin]
rationale: >
  Where the contract leaves the field optional an omission validates cleanly,
  so requiring it everywhere is a plugin house rule no validator expresses. A
  presence check is a plain mechanical comparison — the field is absent or it
  is not the family's published `Literal` URL — so nothing about catching the
  omission needs a human judgment call; it is simply a check nothing here runs
  today. Without it a reviewer, an editor's live validation and any future
  migration all have to guess which contract the document was authored
  against, and it silently reads as belonging to whatever is current. Nothing
  breaks the day it is omitted, which is precisely why the omission survives.
status: active
superseded_by: null
