id: RULE-ENDP-034
statement: >
  A `from_input` binding MUST NOT be authored at a request site the engine
  builds before a record is in scope.
tier: advisory
severity: error
scope: api-endpoint
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation, WriteOperation]
rationale: >
  `from_input` addresses the record being written, so it means something only
  where the engine already has one. A read request has no record at all, and a
  param default and a write's header and query slots are assembled ahead of the
  body the record fills — the binding there has nothing to resolve against. It
  does not fail loudly at run time either: it produces a request with a hole in
  it, sent to the provider as though it were complete. Authors reach for it when
  a provider wants a per-record value in a header; that value has to be declared
  as a param and bound like any other.
status: active
superseded_by: null
