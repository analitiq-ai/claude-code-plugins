id: RULE-ENDP-026
statement: >
  Every `$ref` in an embedded response or input schema MUST be an
  in-document pointer that resolves to a schema node in the same document,
  no set of nodes MUST hand the same value round to each other without any
  of them declaring something about it, and the schema MUST NOT use a
  keyword that retargets the base URI or defers a reference to evaluation
  time.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ResponseExtraction._validate"
owners: [connector-plugin, engine]
targets: [ResponseExtraction, WriteInput]
rationale: >
  Everything on the path that reads an embedded schema runs offline — the
  validator by design, the engine when it resolves an endpoint, the
  conformance kit when it executes a read — so a reference out of the
  document is never followed by anything that could object to it. The
  subtree behind it is not annotation-checked, not covered by a type map,
  and not reported; the author is told nothing. A dangling local pointer
  fails the same way while looking safer, because a reference to nothing
  asserts nothing and every instance satisfies it. A ring looks safer still,
  since every hop in it resolves and lands on a schema, and is worse on both
  counts: nothing in it declares anything about a value, and a consumer that
  does follow it never finishes — a reference is only one of the ways round,
  since a composition branch hands the same value on exactly as a reference
  does, while a keyword descending into a member of the value cannot close a
  ring at all. Closing all of those is
  also what makes it safe for declared-path resolution to follow a `$ref`
  at all: by the time a path is resolved, every reference it can meet is
  local, real, and lands on a node both structural walkers visited.
status: active
superseded_by: null
