id: RULE-CTOR-057
statement: >
  In a connector field a runtime resolves, every ref and every `${...}`
  template placeholder MUST lead with one of the resolution scopes the
  contract declares.
tier: structural
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::ValueExpressionScopes._expressions_qualified"
owners: [connector-plugin, engine]
targets:
  - HttpTransport
  - TransportDefaults
  - AuthOperationTemplate
  - PostAuthOperationRequest
  - AdbcTransport
  - DatabaseTls
  - DsnBinding
rationale: >
  The API-endpoint document has required this of its own expressions since it
  grew typed models for them, and the connector document feeds the same
  grammar from its transports, its auth exchange and its DSN bindings. What
  made the gap worth closing rather than noting is that a transport is the
  whole surface at once: the default header map is folded into every
  transport before any of it resolves, so one unscoped token there reaches
  every request the connector makes rather than one operation. Which fields
  this covers is which fields a runtime resolves — traced through both
  consumers, not read off the annotations, because a field typed `Any` and
  described as taking an expression may still be consumed literally, and one
  beside it is. Where an unscoped token goes depends on which resolver reads
  the document
  — one takes the bare name as a top-level context key and falls back to
  `secrets`, substituting whatever is stored under that name into a request
  that still looks well formed; the other refuses a scope it does not know
  and raises. Neither names the placeholder to the connector's author. The
  leading token is the only part a document can be held to; whether anything
  ever produces a value at the rest of the path is a phase question the
  runtime settles.
status: active
superseded_by: null
