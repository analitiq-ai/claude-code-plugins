id: RULE-CTOR-057
statement: >
  Every ref and every `${...}` template placeholder a connector authors MUST
  lead with one of the resolution scopes the contract declares.
tier: structural
severity: error
scope: connector
validator: "analitiq.contracts.connector::TemplateExpression._expressions_qualified"
owners: [connector-plugin, engine]
targets: [HttpTransport, DsnBinding, TransportRateLimit]
rationale: >
  The API-endpoint document has required this of its own expressions since it
  grew typed models for them, and the connector document feeds the same
  grammar from `base_url`, transport headers and DSN bindings. What made the
  gap worth closing rather than noting is that a transport is the whole
  surface at once: a base URL and a default header apply to every request
  made through it, so one unscoped token reaches all of them rather than one
  operation. Where it then goes depends on which resolver reads the document
  — one takes the bare name as a top-level context key and falls back to
  `secrets`, substituting whatever is stored under that name into a request
  that still looks well formed; the other refuses a scope it does not know
  and raises. Neither names the placeholder to the connector's author. The
  leading token is the only part a document can be held to; whether anything
  ever produces a value at the rest of the path is a phase question the
  runtime settles.
status: active
superseded_by: null
