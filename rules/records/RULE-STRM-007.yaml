id: RULE-STRM-007
statement: >
  A constant MUST carry a value of the JSON kind its declared arrow_type
  admits, and MUST declare the inner shape that type calls for and no other.
tier: advisory
severity: error
scopes: [stream]
validator: "analitiq.contracts.stream::ConstantValue._validate_container_shape"
owners: [pipeline-plugin]
targets: [ConstantValue]
rationale: >
  A constant is the one place the document carries the payload as well as
  its type, so a mismatch between the two is visible here and nowhere else —
  left unchecked it reaches the destination cast as a value of the wrong
  kind and fails the run rather than the document. The null literal stays
  admissible under every type as the shared no-value sentinel, so declaring
  a type and omitting a payload is not what this rule catches.
status: active
superseded_by: null
