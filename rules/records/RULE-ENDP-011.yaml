id: RULE-ENDP-011
statement: >
  Every parameter a replication cursor mapping names MUST be declared by the
  same operation and MUST declare itself controlled by replication.
tier: advisory
severity: error
scope: api-endpoint
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
rationale: >
  A cursor mapping states how the stored watermark is sent, but the param
  carrying it is an ordinary declared param that still has to be bound into the
  request and marked as replication's — a window mapping wires both of its
  bounds that way. Unmarked, nothing reserves the param for the runtime to set;
  undeclared, the watermark never reaches the provider and every incremental run
  quietly pulls the full resource.
status: active
superseded_by: null
