id: RULE-ENDP-057
statement: >
  A windowed cursor mapping MUST state the wire format it sends its bounds as,
  and the comparison the provider applies at each end of the window, using only
  the vocabularies `WindowCursorMapping` declares for each.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::WindowCursorMapping.format"
owners: [connector-plugin, engine]
targets: [WindowCursorMapping]
fields: [format, start_operator, end_operator]
mechanism: literal_enum
rationale: >
  Each end of a window carries its own comparison because whether a bound is
  inclusive is a provider fact, and the ends of a provider's window are
  routinely spelled differently; the format is the spelling the bounds are
  sent as. A wrong end is the quiet kind of failure — records on a boundary
  dropped from every window, or carried in more than one, reading downstream
  as missing rows or duplicates rather than as a mapping to fix — which is
  why each member draws on a closed vocabulary the validator can grade
  instead of free text. The pinned contract-consumption manifest claims no
  read of any field of the windowed form: a run today proceeds as though no
  windowed mapping were declared, so the declaration is graded at authoring
  time only, and holding it to the closed sets is what keeps documents
  already published adoptable as written.
status: active
superseded_by: null
