id: RULE-ENDP-057
statement: >
  A windowed cursor mapping MUST state the wire format it sends its bounds as,
  and the comparison the provider applies at each end of the window, using only
  the vocabularies `WindowCursorMapping` declares for each.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::WindowCursorMapping.format"
owners: [connector-plugin, engine]
targets: [WindowCursorMapping]
fields: [format, start_operator, end_operator]
mechanism: literal_enum
rationale: >
  Each end of a window carries its own comparison because whether a bound is
  inclusive is a provider fact, and the ends of a provider's window are
  routinely spelled differently; the format is the spelling the document
  declares for sending the bounds. A wrong end is the quiet kind of defect —
  a comparison the provider does not apply changes which records a
  boundary's window covers, a gap that reads as missing rows or duplicates
  rather than as a mapping to fix — which is why each member draws on a
  closed vocabulary instead of free text. The pinned contract-consumption
  manifest claims no read of the wire half of the windowed form — the
  format, and the comparison at each end — and it has no effect on a run
  today; the admissible values are the contract's to settle,
  not whichever read the manifest claims.
status: active
superseded_by: null
