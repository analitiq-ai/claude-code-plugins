id: RULE-CTOR-049
statement: >
  A database connector whose class satisfies a write capability MUST declare
  `sql_capabilities`.
tier: reference
severity: error
scopes: [connector]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, engine]
targets: [DatabaseConnector]
rationale: >
  Capability comes from the protocol the class in `connector.py` satisfies
  rather than from a flag in the document, so the two artifacts can disagree
  without either looking wrong on its own: the class advertises writes and
  the document declares no `sql_capabilities`. Known enforcement gap: no
  contract model sees `connector.py`, so nothing here can tell a
  write-capable connector from a discovery-only one and the field stays
  optional; no located engine mechanism checks the disagreement either — the
  class-level role checks that exist grade the CDK's own kind-default
  classes against `Readable`/`Writable` at class-definition time, not this
  connector's own declared block against its own class, so what a live write
  attempt actually does is not confirmed.
status: active
superseded_by: null
