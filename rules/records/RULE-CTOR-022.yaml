id: RULE-CTOR-022
statement: >
  A post-auth output MUST state how its value is produced, where it is durably
  stored and what value type it carries using only the vocabulary
  `PostAuthOutput` declares for each; which pairings of the mode and the
  storage are legal is RULE-CTOR-002.
tier: structural
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::PostAuthOutput.mode"
owners: [connector-plugin, engine]
targets: [PostAuthOutput]
fields: [mode, storage, type]
mechanism: literal_enum
rationale: >
  The mode selects which post-auth flow the engine runs to produce the value
  and the storage selects the durable store it lands in — and because the
  reference path an output materialises at is derived from its storage name
  plus its key, an unrecognised storage value silently invalidates every ref
  and `required_for_activation` entry aimed at it. The type drives coercion of
  whatever the discovery or selection response yields, the same way an input's
  does. Each field is checked alone here because each is independently legal;
  the pairing the mode and the storage must respect is a separate rule, which
  is why this one does not mention it beyond the pointer.
status: active
superseded_by: null
