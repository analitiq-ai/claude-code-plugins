id: RULE-SHRD-007
statement: >
  A `function` expression MUST name a function the engine's registry declares,
  including where documentation describes an unregistered one as planned.
tier: referential
severity: error
scopes: [any]
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  The registry belongs to the engine and is consulted at connect time. A slot
  annotated with the contract's function union rejects a name it carries no
  model for; a transport's base URL is annotated that way. Every other site a
  function expression reaches is loosely typed, so a typo there, or a
  function some document promises is coming, validates clean and fails on the
  first connection attempt, after the connector has shipped. Even the typed
  slot only proves membership in the set this repo models, which tracks the
  engine's registry by maintenance. "Planned" is the trap
  worth naming: prose describing a function reads exactly like prose
  describing one that exists. Catching it means reading the engine's
  registered catalog, which moves on another repository's release schedule.
status: active
superseded_by: null
