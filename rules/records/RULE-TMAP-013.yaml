id: RULE-TMAP-013
statement: >
  A type map's rules MUST be authored in the order they are meant to resolve,
  with a narrow rule ahead of any broader rule that would also match its input.
tier: procedural
severity: error
scope: type-map
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  Resolution stops at the first matching rule in both directions, and for a
  connection-scoped endpoint the two scopes' rule lists are concatenated into
  one such list, so a rule placed under a broader sibling does not merely fail
  to fire — the broader rule renders its canonical instead, for exactly the
  columns the narrow rule was written for. Order carries no visible weight in
  the document, so an author grouping rules by family rather than by breadth
  produces a map that validates and resolves wrongly. Every permutation of the
  same rules is an equally valid document, so nothing here can see the
  shadowing.
status: active
superseded_by: null
