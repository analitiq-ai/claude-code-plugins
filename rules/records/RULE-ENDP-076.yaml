id: RULE-ENDP-076
statement: >
  A parameter's declared numeric bounds and numeric `enum` members MUST be
  finite, and no declared lower bound — `minimum`, `minLength`, `minItems` —
  MUST exceed the upper bound it pairs with.
tier: shape
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::Param._validate"
owners: [connector-plugin, engine]
targets: [Param]
fixture_model: Param
rationale: >
  No non-finite number has an RFC 8259 JSON number spelling, so a bound or
  `enum` member holding one cannot be written as standard JSON. A lower bound
  above its upper bound admits no value at all, so every value the param is
  given fails its own declaration and the param is unsendable on every run.
  As the engine reads it today, it refuses a non-finite bound or an inverted
  interval when it compiles the param's rules, before any request. Refusing
  each here names the declaration at authoring time. The predicate is a fact
  about the declaration itself and holds whatever the engine does with it.
status: active
superseded_by: null
