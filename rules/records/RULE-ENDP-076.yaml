id: RULE-ENDP-076
statement: >
  A parameter's declared numeric bounds MUST be finite, and no declared lower
  bound — `minimum`, `minLength`, `minItems` — MUST exceed the upper bound it
  pairs with.
tier: shape
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::Param._validate"
owners: [connector-plugin, engine]
targets: [Param]
fixture_model: Param
rationale: >
  A bound that is not a finite number orders nothing — every comparison
  against NaN is false — and a lower bound above its upper bound admits no
  value at all. Either way every value the param is given fails its own
  declaration, so the param is unsendable on every run; as the engine reads
  it today, it refuses such a declaration when it compiles the param's
  rules, before any request. Refusing it here names the declaration at
  authoring time. The predicate is a fact about the declaration itself and
  holds whatever the engine does with it.
status: active
superseded_by: null
