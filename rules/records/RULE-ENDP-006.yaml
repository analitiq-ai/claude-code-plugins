id: RULE-ENDP-006
statement: >
  Every node of a write mode's input schema that declares either the native
  type or the canonical Arrow type MUST declare both, and MUST carry the
  sibling declarations its container form requires.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::WriteInput._validate"
owners: [connector-plugin, engine]
targets: [WriteInput]
rationale: >
  The input schema is the only description of the record being written: every
  record-addressed binding and conflict key is resolved against its declared
  fields, and a node that declares a type is declaring the one the destination
  field is frozen to. Pairing is what makes that declaration checkable — the
  coverage RULE-PKG-033 states reads a node as typed only where it carries the
  native token and the canonical type together, so a half-typed node is not
  merely incomplete, it is invisible: it reads as annotated on the page, no
  read-map rule is ever resolved for it, and the type it half-states constrains
  nothing anywhere. The container half is what keeps a structured field
  traversable — a container head whose members are undeclared describes nothing
  a per-field binding can address, so the binding into that record resolves
  against a shape that is not there.
status: active
superseded_by: null
