id: RULE-CTOR-014
statement: >
  A write_unit MUST declare at least one bound; a block declaring none states
  no preference and MUST be omitted instead.
tier: advisory
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::WriteUnit._at_least_one_bound"
owners: [engine, connector-plugin]
targets: [WriteUnit]
rationale: >
  write_unit exists to tell the engine's batch coalescer what to aim for, and
  absence of the whole block already means "no preference". An empty block is
  therefore a second spelling of the default that reads like a declared one:
  the coalescer sees no preference either way, and only the bound the author
  meant to state is missing. Whether that author forgot the value or meant the
  default is not knowable from the document, so the model refuses the
  ambiguous spelling rather than let it pass as a declaration — and a model
  validator can only refuse, so the document does not validate until the
  bound is stated or the block is dropped.
status: active
superseded_by: null
