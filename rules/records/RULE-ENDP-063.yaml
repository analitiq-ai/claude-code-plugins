id: RULE-ENDP-063
statement: >
  Every value an embedded request or response schema records under `examples`
  MUST satisfy the schema node that declares it.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.validator.connectors::_embedded_schema_example_findings"
owners: [connector-plugin, engine]
rationale: >
  Every other check over an endpoint compares one declaration with another —
  a node's native token against its canonical Arrow type, that type against the
  sibling read map, the map against the canonical vocabulary — and they agree
  because each reads the same claim restated somewhere else. None of them can
  ask whether the claim is right about the provider, because nothing they read
  came from the provider. A recorded sample is the exception: it is copied off
  the wire, which makes it the one value in the document a declaration can be
  graded against. What is graded is the node's own JSON Schema statement: a flag
  the provider sends as the strings "0" and "1" under a node whose `type` says
  boolean satisfies every declaration-to-declaration check, and as the engine
  stands the disagreement surfaces when the first batch is cast rather than
  while the endpoint is being authored. The verdict itself needs none of that
  reading — a value contradicting the schema recording it is wrong on the
  document's own terms — so the check stays correct however the engine's casting
  changes. A node that states no type states nothing a value can contradict, and
  is graded against nothing: deciding one would take a mapping from JSON kinds
  onto Arrow families, which is cast semantics this contract does not own and
  could not pin. Grading is otherwise left to a JSON Schema implementation
  reading the node, so nothing restates keyword semantics here, and a node
  carrying no sample is graded on nothing — the rule obliges nobody to record
  one, and an absent sample is never read as agreement.
status: active
superseded_by: null
