id: RULE-ENDP-063
statement: >
  A node of an endpoint's response or write-input schema that records wire
  samples under `examples` and declares — on the node, or one fold away in a
  `$ref` target or `allOf` branch — a canonical Arrow type whose family
  carries a timezone position MUST declare one whose zone-awareness those
  samples bear out, and each such sample written as a date-time MUST name a
  moment that exists. A node reached through a position whose subschema does
  not describe the instance is exempt — `not`, which says what the instance
  must not be; `if`, which selects a branch rather than constraining; and
  `propertyNames`, which constrains the KEYS. A sample recorded at one of
  those is not a value the declaration beside it claims to describe, so
  agreement between them says nothing either way. Recording a sample never obliges a node to declare a type it
  has no evidence for.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::_validate_examples_zone"
owners: [connector-plugin, engine]
targets: [ResponseExtraction, WriteInput]
fixture_model: WriteInput
rationale: >
  RULE-SHRD-002 decides a temporal's zone from a real wire value and states
  what a wrong call costs; until a document recorded such a value the decision
  was unfalsifiable, since only the value the provider actually sends
  distinguishes the zone a declaration claims from the one it should have
  claimed. A sample recorded beside the declaration
  turns that judgment into an arithmetic one, and it is graded here because a
  zone is not a JSON Schema property: a string carrying an offset and a string
  carrying none are the same `type: string`, so nothing in the draft the
  embedded schema is written in can object. Only what can be read is graded —
  a family with no timezone position has nothing to contradict, a sample that
  is not a date-time literal answers nothing, a node whose declaration cannot
  be folded together reaches no declaration at all, and a sample recorded where the
  declaration describes the instance's opposite is a counter-example rather
  than evidence against itself — so silence here is absence of evidence, never
  evidence the declaration is right. The exception is a
  sample wearing the date-time shape over a moment that does not exist, which
  is refused rather than passed over: `format` is an annotation the draft does
  not assert, and a `Z` on a thirteenth month would otherwise read as evidence
  of a zone and stand in for the wire value nobody recorded.
status: active
superseded_by: null
