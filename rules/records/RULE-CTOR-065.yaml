id: RULE-CTOR-065
statement: >
  An expression dict in a connector field a runtime resolves MUST declare
  exactly one expression key and carry no sibling beyond the argument fields
  that key itself declares.
tier: structural
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::ValueExpressionScopes._expressions_well_formed"
owners: [connector-plugin, engine]
targets:
  - HttpTransport
  - TransportDefaults
  - AuthOperationTemplate
  - PostAuthOperationRequest
  - AdbcTransport
  - DatabaseTls
  - DsnBinding
rationale: >
  The endpoint document has refused this shape in its request slots since the
  shape walk landed there (RULE-ENDP-022), and the grammar is why the shape
  matters everywhere: resolution dispatches on the one expression key it
  recognises, so of two markers only one can win and a stray sibling is an
  edit with nothing to take effect on. What a malformed node costs depends on
  which resolver reads it — the engine's transport resolver refuses the node
  while materializing the transport, at connect time, per connection, after
  the connector was published and validated clean; the resolution paths that
  dispatch instead carry the winning marker to the wire and drop the author's
  other edit without a trace. The connector document feeds both from untyped
  sites — its transport header maps, its auth-exchange bodies, its DSN
  bindings and driver kwargs — so no annotation grades these dicts, and both
  failure modes escaped authoring. On a transport the blast radius is the
  whole surface at once, because the default header map folds into every
  transport before any of it resolves. Which fields this covers is which
  fields a runtime resolves, the same traced set the scope rule covers.
  Unlike the endpoint document, no `x-*` sibling is admitted: the authored
  connector contract is closed, so there is no extension policy for one to
  ride on. The permitted `function` siblings are the union of the argument
  fields across the function models, mirroring the dispatch, which reads
  them whichever function is named; per-function argument shapes are the
  typed union's job, where a field carries it. The shape is the whole of
  this rule — whether a well-formed function node names a function the
  engine registers is RULE-SHRD-007, deliberately out of reach here.
status: active
superseded_by: null
