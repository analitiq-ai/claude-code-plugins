id: RULE-CTOR-065
statement: >
  An expression dict in a connector field a runtime resolves MUST declare
  exactly one expression key and carry no sibling beyond the argument fields
  that key itself declares.
tier: structural
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::ValueExpressionScopes._expressions_well_formed"
owners: [connector-plugin, engine]
targets:
  - HttpTransport
  - TransportDefaults
  - AuthOperationTemplate
  - PostAuthOperationRequest
  - AdbcTransport
  - DatabaseTls
  - DsnBinding
rationale: >
  The endpoint document has refused this shape in its request slots since the
  shape walk landed there (RULE-ENDP-022), for a reason that holds wherever
  the resolver reads a dict: it dispatches on the one key it recognises, in
  its own precedence order, and ignores every sibling. A stray sibling is an
  author's edit that never took effect, and two markers resolve through one
  and silently discard the other — the author reads the ref they wrote, the
  wire carries the literal beside it. The connector document feeds the same
  resolver from untyped sites — its transport header maps, its auth-exchange
  bodies, its DSN bindings and driver kwargs — so no annotation grades these
  dicts, and a malformed node validated clean until the engine's resolver
  refused it while materializing the transport: at connect time, per
  connection, after the connector was published. On a transport the blast
  radius is the whole surface at once, because the default header map folds
  into every transport before any of it resolves. Which fields this covers is
  which fields a runtime resolves, the same traced set the scope rule
  covers. Unlike the endpoint document, no `x-*` sibling is admitted: the
  authored connector contract is closed, so there is no extension policy for
  one to ride on. The shape is the whole of this rule — whether a
  well-formed function node names a function the engine registers is
  RULE-SHRD-007, deliberately out of reach here.
status: active
superseded_by: null
