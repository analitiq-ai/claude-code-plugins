id: RULE-ENDP-055
statement: >
  The operator a `filters` map entry keys on MUST come from the Analitiq
  API-filter operator vocabulary.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation.filters"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [ReadOperation]
fields: [filters]
mechanism: literal_enum
rationale: >
  This vocabulary is the endpoint's promise to every stream that binds it: a
  filter is authored against these members (RULE-STRM-026 names that
  obligation on the stream side), so the two documents agree only while both
  read one set. Membership is a promise the operation accepts a request built
  with that operator; how it reaches the wire is the entry's own
  `from_param`/`template` landing site, not a fact this vocabulary states.
status: active
superseded_by: null
