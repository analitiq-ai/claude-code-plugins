id: RULE-ENDP-055
statement: >
  A filterable field MUST name its operators from the operator vocabulary the
  contract declares for an API read.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation.filters"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [ReadOperation]
fields: [filters]
mechanism: literal_enum
rationale: >
  The map is the endpoint's promise to every stream that binds it: a filter is
  authored against these members and written to the parameter each one names, so
  the two documents agree only while both read one vocabulary. The members are
  the comparisons a provider can be asked for, which is a narrower set than the
  ones a dialect can compile — the dialect-only spellings have no general form a
  provider accepts, so offering one here would promise a comparison no request
  could carry.
status: active
superseded_by: null
