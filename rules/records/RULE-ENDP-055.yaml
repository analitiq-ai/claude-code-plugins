id: RULE-ENDP-055
statement: >
  A filterable field MUST name its operators from the operator vocabulary the
  read operation's `filters` map declares.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation.filters"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [ReadOperation]
fields: [filters]
mechanism: literal_enum
rationale: >
  This map is the endpoint's promise to every stream that binds it: a filter is
  authored against these members and rendered onto the landing site each one
  names, so the two documents agree only while both read one vocabulary. The
  members are the comparisons a provider can be asked for, which is a narrower
  set than the ones a dialect can compile — an operator offered here has to
  survive being serialised into a request the provider accepts, rather than
  becoming a predicate the way a database read's operator does.
status: active
superseded_by: null
