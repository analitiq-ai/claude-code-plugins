id: RULE-ENDP-056
statement: >
  A single-bound cursor mapping MUST state the wire format it sends the cursor
  value as, and the comparison the provider applies to it, using only the
  vocabularies `SingleCursorMapping` declares for each.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::SingleCursorMapping.format"
owners: [connector-plugin, engine]
targets: [SingleCursorMapping]
fields: [format, operator]
mechanism: literal_enum
rationale: >
  The wire half of a cursor mapping — the spelling the stored cursor is sent
  as, and the comparison the provider is expected to apply to it — is a fact
  about the provider, so each member draws on a closed vocabulary: that is
  what lets the declaration be graded at authoring time rather than trusted.
  The pinned contract-consumption manifest claims no read of the wire half
  of a cursor mapping, and a run today sends the stored value as-is; what
  the closed sets buy now is agreement between author and validator, and a
  declaration the engine can adopt without re-reading documents already
  published against it.
status: active
superseded_by: null
