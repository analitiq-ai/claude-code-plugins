id: RULE-ENDP-056
statement: >
  A single-bound cursor mapping MUST state the wire format it sends the cursor
  value as, and the comparison the provider applies to it, using only the
  vocabularies `SingleCursorMapping` declares for each.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::SingleCursorMapping.format"
owners: [connector-plugin, engine]
targets: [SingleCursorMapping]
fields: [format, operator]
mechanism: literal_enum
rationale: >
  The format member decides how the engine renders the stored cursor onto the
  request, and the comparison member decides which records the provider is
  expected to return for it. Both are read at every incremental run and neither
  is discoverable from the response: a format the engine cannot render sends a
  value the provider parses as something else, and a comparison the provider
  does not apply silently changes what the window covers — either way the run
  succeeds and the rows it should have carried are gone.
status: active
superseded_by: null
