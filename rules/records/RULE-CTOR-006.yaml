id: RULE-CTOR-006
statement: >
  Two declarations in one connection contract MUST NOT resolve to the same
  secret storage path.
tier: advisory
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::ConnectorBase._connection_contract_internal_refs"
owners: [engine, connector-plugin]
targets: [ConnectorBase]
rationale: >
  A storage path is derived from the storage kind plus the declaration key, and
  an input and a post-auth output are declared in different blocks — so two
  declarations can collide on a path that is written down nowhere a reader
  would compare them. When they do, one silently overwrites the other in the
  secret store and the connection authenticates with whichever was written
  last, which presents as a wrong credential and never as a contract defect.
status: active
superseded_by: null
