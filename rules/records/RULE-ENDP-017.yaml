id: RULE-ENDP-017
statement: >
  A write mode's request body MUST address the record scope its batching
  declaration implies — the whole batch when batching is declared, a single
  record or one of its fields otherwise — and any field path it addresses MUST
  be declared in that mode's input schema.
tier: advisory
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::WriteOperation._wiring"
owners: [connector-plugin, engine]
targets: [WriteOperation]
rationale: >
  The batching declaration and the body's record scope are two statements about
  the same fact — how many records one request carries — and when they disagree
  the engine builds the request around the wrong shape: an array where the
  provider expects one object, or one record where it expects the batch. Neither
  is a schema error the provider reports usefully. The membership half is
  checked in the same pass because a mistyped field path resolves to nothing and
  sends a null the provider stores over real data.
status: active
superseded_by: null
