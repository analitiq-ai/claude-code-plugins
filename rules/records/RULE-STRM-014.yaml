id: RULE-STRM-014
statement: >
  A stream source bound to a connector-scoped endpoint MUST NOT declare any
  read feature the source model reserves for database sources.
tier: advisory
severity: error
scope: stream
validator: "packages/contract-models/src/analitiq/contracts/stream.py::StreamSource._validate_database_only_read_features"
owners: [pipeline-plugin, engine]
targets: [StreamSource]
fixture_model: StreamSource
rationale: >
  Those features describe how a database read is shaped — which columns the
  query projects, how it pages, how it breaks cursor ties — and an API read
  has none of them to configure, so declaring one on an API source is an
  instruction nothing will ever act on. The structural types cannot see the
  scope; only the binding knows it, which is why the check lives on the
  source rather than on the fields themselves. Declaring an empty value
  counts as declaring the feature, because an author who writes one has
  formed the wrong model of the read.
status: active
superseded_by: null
