id: RULE-PKG-020
statement: >
  A connector MUST NOT invent a stage name; stage naming is engine-owned
  and deterministic, and a name the connector chose breaks the idempotency
  a retried batch depends on.
tier: procedural
severity: error
scope: connector-package
validator: null
owners: [connector-plugin, engine]
rationale: >
  Determinism is what makes a retry self-healing: the same batch reuses the
  same stage relation and cleans up whatever the previous attempt left
  behind. A connector-chosen name — a timestamp, a uuid, anything unique —
  is invisible to that and leaves orphaned relations plus rows landed
  twice, and it is a natural thing to write because uniqueness looks like
  the safe property. Stage naming happens inside `connector.py` at run
  time; nothing in this repo and no conformance test observes the name a
  dialect uses, so the damage first appears in production.
status: active
superseded_by: null
