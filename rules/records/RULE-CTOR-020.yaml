id: RULE-CTOR-020
statement: >
  Each discovery action a connector configures on `ResourceDiscoveryTriggers`
  MUST name its trigger from the closed vocabulary that model's matching field
  declares.
tier: structural
severity: error
scope: connector
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/connector.py::ResourceDiscoveryTriggers.list_resources"
owners: [connector-plugin, engine]
targets: [ResourceDiscoveryTriggers]
fields: [list_resources, describe_resource]
mechanism: literal_enum
rationale: >
  A trigger names a moment in the connection lifecycle that the engine raises,
  not a label the connector invents: an unrecognised trigger is never raised,
  so the discovery action simply never runs and the connector presents as
  having no endpoints rather than as having a typo. Declaring the vocabulary
  on the field turns that into an authoring-time rejection and publishes the
  admissible moments in the JSON Schema, so nothing has to restate them.
status: active
superseded_by: null
