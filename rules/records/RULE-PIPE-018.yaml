id: RULE-PIPE-018
statement: >
  A pipeline package's pipeline document MUST declare a non-empty
  `pipeline_id`.
tier: reference
severity: error
artifact_kinds: [pipeline]
validator: "analitiq.validator.pipelines::_check_pipeline_id"
owners: [pipeline-plugin, engine]
rationale: >
  Every stream the package holds names its parent by this id, and nothing
  else in the package stands in for it. The pipeline model leaves the field
  optional, so without this check a document missing it passes validation and
  fails only when a stream's parent reference is resolved at run time.
status: active
superseded_by: null
