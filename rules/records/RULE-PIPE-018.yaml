id: RULE-PIPE-018
statement: >
  A pipeline package's pipeline document MUST declare a non-empty
  `pipeline_id`.
tier: reference
severity: error
artifact_kinds: [pipeline]
validator: "analitiq.validator.pipelines::_check_pipeline_id"
owners: [pipeline-plugin, engine]
rationale: >
  Every stream the package holds names its parent by this id, and nothing
  else in the package stands in for it. A pipeline document missing this
  field fails only when something resolves against the id that never
  arrived, which is after the package has been handed to a run.
status: active
superseded_by: null
