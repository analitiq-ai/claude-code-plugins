id: RULE-ENDP-041
statement: >
  Every URL an endpoint's request produces, including a next-page link it
  follows, MUST land on the origin of the transport its `transport_ref` names.
tier: reference
severity: error
artifact_kinds: [api-endpoint]
validator: null
enforcement_location: engine
owners: [connector-plugin, engine]
targets: [_RequestBase]
rationale: >
  The transport is where the connection's origin, its auth and its TLS settings
  are declared, so a URL that leaves that origin either arrives without the
  credentials the request needs or carries them to a host the connection never
  named. The half of containment that checks the transport *name* is settled at
  author time; the origin half is settled at run time by the engine itself: it
  resolves the transport an operation actually names through `transport_ref` —
  the default and a named non-default alike — separately for each operation,
  and checks every URL that operation's request produces, including a followed
  next-page link, against that resolved transport's own declared origin on
  both the read and the write path, refusing one that lands anywhere else.
  Because the check runs against the transport actually selected for the
  request rather than a single fixed one, a non-default `transport_ref` is
  covered the same way the default is.
status: active
superseded_by: null
