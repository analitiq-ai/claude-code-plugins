id: RULE-TMAP-005
statement: >
  A `regex` read rule's native_type pattern MUST compile under the RE2 regex
  dialect.
tier: shape
severity: error
artifact_kinds: [type-map]
validator: "analitiq.contracts.type_map::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapReadRegexRule]
rationale: >
  The engine compiles a read rule's matcher with RE2 when it loads the connector
  and refuses the run on a pattern RE2 cannot parse, so a matcher that compiles
  only under a richer dialect passes authoring and fails where it ships. The
  dialects diverge in each direction — the lookaround, atomic groups and
  backreferences an author reaches for by habit are not RE2 syntax, and RE2
  admits syntax of its own that a backtracking engine refuses — and either kind
  reads as ordinary regex on the page, so only compiling under the dialect that
  will match it tells the author which one they wrote. This states the engine as
  it stands: the check runs stricter than the runtime if the engine's matcher
  comes to accept what this check's RE2 rejects, and looser if the check
  resolves an RE2 release accepting what the engine's refuses.
status: active
superseded_by: null
