id: RULE-TMAP-005
statement: >
  A `regex` read rule's native_type pattern MUST compile under the RE2 regex
  dialect, and a named capture in it MUST be spelled `(?<name>…)` under a name
  no other group carries.
tier: shape
severity: error
artifact_kinds: [type-map]
validator: "analitiq.contracts.type_map::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapReadRegexRule]
rationale: >
  The engine compiles a read rule's matcher with RE2 when it loads the connector
  and refuses the run on a pattern RE2 cannot parse, so a matcher that compiles
  only under a richer dialect passes authoring and fails where it ships. The
  lookaround, atomic groups and backreferences an author reaches for by habit
  are not RE2 syntax and read as ordinary regex on the page, so only compiling
  under the dialect that will match it tells the author which one they wrote.
  RE2 also takes Python's `(?P<name>…)` spelling; this contract takes only
  `(?<name>…)`, which makes the spelling the contract's choice rather than the
  dialect's. RE2 also compiles a name given to more than one group and binds it
  to the first, so a match through a later group leaves the placeholder with
  nothing to render. This states the engine as it stands: it validates the map
  against the contract models and then compiles the matcher with RE2. The gate
  compiles with RE2 as well, so the two agree while their RE2 releases parse
  the same syntax. Where the engine's release accepts a construct the gate's
  refuses, the gate is stricter than the run and rejects a matcher that would
  load; where it refuses one the gate's accepts, the matcher passes authoring
  and is refused at load.
status: active
superseded_by: null
