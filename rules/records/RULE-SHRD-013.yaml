id: RULE-SHRD-013
statement: >
  An error-handling block MUST name what happens to a record once its retries
  are exhausted, from the vocabulary `RetryErrorHandlingBase` declares.
tier: structural
severity: error
scopes: [any]
validator: "analitiq.contracts.shared.common::RetryErrorHandlingBase.strategy"
owners: [pipeline-plugin, engine]
targets: [RetryErrorHandlingBase]
fields: [strategy]
mechanism: literal_enum
rationale: >
  Each member is a different disposition for data the run could not deliver —
  stop, park it where someone can retrieve it, or drop it and continue — so the
  choice decides whether records that failed are recoverable at all. It is
  declared once on the shared base because every block that inherits it is
  answering the same question about a different stage, and an author who learns
  the vocabulary at one of them carries it to the rest. `RULE-RETRY-001` reads
  the sibling retry fields on the same base.
status: active
superseded_by: null
