id: RULE-PIPE-017
statement: >
  A pipeline's logging block MUST name its level from the vocabulary `Logging`
  declares.
tier: structural
severity: error
scopes: [pipeline]
validator: "analitiq.contracts.pipelines.config::Logging.log_level"
owners: [pipeline-plugin, engine]
targets: [Logging]
fields: [log_level]
mechanism: literal_enum
rationale: >
  A level is a threshold, ordered rather than merely named — the level
  chosen decides how much of a failed run there is to read afterwards — and
  an unrecognised value has no position in that ordering, so the vocabulary
  is closed where the document is graded. The pinned contract-consumption
  manifest claims no read of the logging block, and a run today logs at the
  engine's own defaults whatever the pipeline declares: the closed set is
  currently what keeps the declaration honest at authoring time, and what
  lets the engine adopt the block without re-grading documents already
  published against it.
status: active
superseded_by: null
