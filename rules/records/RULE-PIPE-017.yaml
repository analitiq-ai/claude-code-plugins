id: RULE-PIPE-017
statement: >
  A pipeline's logging block MUST name its level from the vocabulary `Logging`
  declares.
tier: structural
severity: error
scopes: [pipeline]
validator: "analitiq.contracts.pipelines.config::Logging.log_level"
owners: [pipeline-plugin, engine]
targets: [Logging]
fields: [log_level]
mechanism: literal_enum
rationale: >
  A level is a threshold, ordered rather than merely named — the level an
  author chooses states how much of a failed run they expect to have to
  read afterwards — and an unrecognised value has no position in that
  ordering, so the vocabulary is closed where the document is graded. The
  pinned contract-consumption manifest claims no read of the level, and it
  has no effect on a run today; the admissible values are the
  contract's to settle, not whichever read the manifest claims.
status: active
superseded_by: null
