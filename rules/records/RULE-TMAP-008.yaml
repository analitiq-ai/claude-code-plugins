id: RULE-TMAP-008
statement: >
  A write `exact` rule's arrow_type MUST hold against the cross-parameter bounds
  its Arrow family declares, and the native_type DDL it renders MUST carry only
  well-formed placeholders.
tier: structural
severity: error
scopes: [type-map]
validator: "analitiq.contracts.type_map::TypeMapWriteExactRule._check"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [TypeMapWriteExactRule]
rationale: >
  A write rule's arrow_type is a matcher, so an arrow_type violating its own
  family's bounds is a rule that can never match anything the read side is
  allowed to produce — it reads as coverage and delivers none. The bounds
  themselves are the engine-published grammar's, not this rule's, so the check
  moves with the grammar pin. The placeholder half is folded in here because
  the DDL render is the one string in the rule that reaches the database.
status: active
superseded_by: null
