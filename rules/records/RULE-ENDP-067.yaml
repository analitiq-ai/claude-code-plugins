id: RULE-ENDP-067
statement: >
  Two operators on the same `filters` field entry MUST NOT resolve to the
  same landing site.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A landing site — one param, or one template — carries one value. Two
  operators bound to the same one is the ambiguity this map exists to close:
  before it, nothing checked whether `eq`, `contains` and `starts_with` built
  the request identically, and a run over the wrong operator succeeded
  silently. Refusing the entry at authoring time is where the mistake is
  still attached to the line that made it.
status: active
superseded_by: null
