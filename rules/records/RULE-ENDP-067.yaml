id: RULE-ENDP-067
statement: >
  A filter binding that renders its own value MUST interpolate the filter's
  value, MUST NOT restate it unchanged, and MUST read nothing else from the
  stream scope.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
rationale: >
  A rendered value exists for the providers that spell a comparison inside the
  value rather than in the key, so what it renders around is the filter's own
  value; one that never interpolates it carries a predicate the stream did not
  ask for, which is the same wrong-rows-on-a-green-run failure the map exists to
  prevent, re-entering through the door the map opened. One that restates it
  unchanged is the verbatim binding written the long way, and omitting the value
  already spells that — admitting both would give one wire value two spellings,
  which is what a rule about parameters being bound once has to compare.
  Nothing else about the filter is addressable because nothing else is
  unambiguous: a binding is already scoped to one field and one operator by the
  keys it sits under, so a path naming either could disagree with the key above
  it. The unchanged-restatement half reaches only the forms a document settles
  on its own — a ref naming the path, and a template that is only that
  placeholder. A function is not settled: what it returns is the function's
  business, and one that returns its input unchanged cannot be told from one
  that transforms it, so a function wrapping the filter value is accepted and
  the author owns whether it earns its place.
status: active
superseded_by: null
