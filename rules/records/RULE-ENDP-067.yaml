id: RULE-ENDP-067
statement: >
  A filter binding that renders its own value MUST interpolate the filter's
  value, MUST NOT restate it unchanged, and MUST read nothing else from the
  stream scope.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
rationale: >
  A rendered value exists for the providers that spell a comparison inside the
  value rather than in the key, so what it renders around is the filter's own
  value; one that never interpolates it carries a predicate the stream did not
  ask for, which is the same wrong-rows-on-a-green-run failure the map exists to
  prevent, re-entering through the door the map opened. Restating the value
  unchanged is the opposite failure: it is the verbatim binding written the long
  way, and omitting the value already spells it. That half reaches a ref naming
  the path and nothing else — a template of only that placeholder is not a
  restatement, because resolution stringifies what it substitutes, so it is how
  a typed slot asks for the value's string form. Nothing else about the filter
  is addressable because nothing else is unambiguous: a binding is already
  scoped to one field and one operator by the keys it sits under, so a path
  naming either could disagree with the key above it. Every clause here is
  decidable because the field admits a ref and a template only, both of which
  put every token they carry where the resolver reads it — the excluded forms
  would each require this contract to model how resolution descends, or what a
  function returns, to say anything at all about what reaches the wire.
status: active
superseded_by: null
