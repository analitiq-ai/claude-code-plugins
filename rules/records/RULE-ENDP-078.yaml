id: RULE-ENDP-078
statement: >
  A replication cursor field typed `integer` MUST NOT declare a calendar
  `format` (`date-time`, `date`). An epoch `format` (`epoch_seconds`,
  `epoch_milliseconds`) makes it a moment; any other `format`, such as a
  provider width token like `int64`, or none makes it an id. A cursor mapping
  over an id MUST declare no `format` and MUST NOT take the window form.
tier: coherence
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fixture_model: ReadOperation
rationale: >
  An integer cursor is either a moment counted in epoch ticks or an id
  counted in records, and the cursor field's `format` is the only thing that
  says which. A calendar format on an integer claims a moment the value
  cannot spell. An id has no "now", so a window over it has no end, and a
  mapping `format` over it asks for an id rendered as a date. As the engine
  reads it today, each of these is refused when the first stored cursor is
  read back, which is after the whole first read has run and committed its
  checkpoint. The `format` read is the field node's own key, taken off the
  node as written; a format sitting inside an
  `anyOf`/`oneOf` branch, or behind a `$ref` or an `allOf`, is invisible to
  that reader, which is why RULE-ENDP-074 refuses a cursor field typed that
  way before this rule is reached. A field that writes its `type` itself and
  hides only its `format` behind a pointer passes RULE-ENDP-074 and lands
  here, where reading the authored node is what makes this rule call it an id
  — the same thing the engine calls it. Refusing it here moves that failure to authoring time; the
  predicate reads only the document, so a stale reading of the engine can
  make this rule stricter than needed but never lets through a pairing whose
  meaning the document leaves undecided.
status: active
superseded_by: null
