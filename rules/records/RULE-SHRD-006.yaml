id: RULE-SHRD-006
statement: >
  A `${...}` placeholder MUST appear only where the value-expression grammar
  resolves a template; every other slot takes the characters literally.
tier: structural
severity: error
scopes: [any]
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
targets: [_RequestBase, UrlTemplateDsn]
rationale: >
  The resolver substitutes into the strings it is handed and nothing else, so
  outside the fields that refuse a placeholder structurally an out-of-place
  `${...}` validates cleanly and is simply never expanded — the braces go out
  on the wire inside a URL, a DSN or a header, and the failure comes back as a
  provider error naming nothing the author wrote. The idiom is seductive
  because it works two fields over. Which slots resolve is the grammar's to
  say, so the only way to check one is to look it up there.
status: active
superseded_by: null
