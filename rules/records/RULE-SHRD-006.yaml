id: RULE-SHRD-006
statement: >
  A `${...}` placeholder MUST appear only where the value-expression grammar
  resolves a template; every other slot takes the characters literally.
tier: shape
severity: error
scopes: [any]
validator: "analitiq.contracts.endpoints::_validate_param_wiring"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [_RequestBase, UrlTemplateDsn]
rationale: >
  The resolver substitutes into the strings it is handed and nothing else, so
  outside the fields that refuse a placeholder structurally an out-of-place
  `${...}` validates cleanly and is simply never expanded — the braces go out
  on the wire inside a URL, a DSN or a header, and the failure comes back as a
  provider error naming nothing the author wrote. The idiom is seductive
  because it works two fields over. `_RequestBase.path` and
  `UrlTemplateDsn.template` reject the sigil structurally under their own
  rules; `_RequestBase.path_params` resolves only `{from_param}`/
  `{from_input}` singleton dispatch and never reaches the template resolver,
  so it rejects the same sigil here. `headers`, `query` and `body` are not
  targets of this rule: they do resolve `${...}` templates, and a wrong
  leading scope there is a separate defect the value-expression grammar
  already names.
status: active
superseded_by: null
