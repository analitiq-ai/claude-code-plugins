id: RULE-TMAP-019
statement: >
  A canonical family a connector's write map leaves unrendered MUST be one the
  connector's own dialect renders in code, never one left out to cut scope.
tier: referential
severity: warning
scope: type-map
mechanized: false
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  A dialect that overrides the column-type renderer takes the family off the
  map path entirely, so a rule for it would be dead weight and its absence is
  correct — some families genuinely need arithmetic no rule can express, such
  as choosing between a system's narrow and wide numeric on a precision range.
  That makes an absent family ambiguous in exactly the way a coverage report
  cannot resolve: the same hole means "handed to the dialect" or "not done
  yet", and only the connector package's dialect says which. No validator opens
  those files, so the write-coverage probe can report the gap but only as a
  warning, and reconciling each family it names against the dialect is the
  author's step.
status: active
superseded_by: null
