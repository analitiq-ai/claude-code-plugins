id: RULE-TMAP-003
statement: >
  Every `${name}` a read rule's canonical render substitutes MUST name a
  capture group its own native pattern declares.
tier: advisory
severity: error
scope: type-map
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/type_map.py::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapReadRegexRule]
rationale: >
  A placeholder with no capture behind it has nothing to substitute, so the
  rule renders a canonical still carrying `${…}` — a string no Arrow type
  parser accepts — and the failure lands at discovery, far from the map that
  caused it. Typing the placeholder and the group with different spellings is
  the ordinary way to get here, which is why the correspondence is checked
  rather than assumed.
status: active
superseded_by: null
