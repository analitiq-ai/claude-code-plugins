id: RULE-TMAP-018
statement: >
  A connection-scoped type map's write section MUST declare a rule only for
  an arrow_type its connector's own write map does not already render.
tier: reference
severity: error
artifact_kinds: [type-map]
validator: "analitiq.validator.pipelines::_check_connection_type_map_shadow"
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  The engine composes the connection map as primary over the connector map by
  concatenating the two rule lists into one first-match list, so a write rule
  repeating something the connector already renders does not sit harmlessly
  beside it — it replaces the connector's rendering for every stream on that
  connection, including streams nobody was editing. An author closing a
  discovery gap has the connector's rules in front of them and it costs nothing
  to restate one, which is exactly how the override happens by accident. The
  connection and its connector are separate documents joined only at
  resolution time, so catching a shadow needs both in hand at once — a bare
  connection-package or connector-package grading never has the other side,
  only a workspace request pairs them by the connection's connector_id and
  resolves each authored write rule against the connector's map first, the
  same resolution the gap helper offers an author on demand. The read
  direction is the mirror obligation (`RULE-TMAP-024`) and is not covered
  here. If the engine's composition order changes so the connector's rules
  resolve before the connection's, this check starts rejecting documents that
  no longer shadow anything — a false positive, not a missed one — since a
  restated connection rule would then sit harmlessly behind the connector's
  own rendering instead of overriding it.
status: active
superseded_by: null
