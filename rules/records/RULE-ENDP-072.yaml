id: RULE-ENDP-072
statement: >
  A `filters` map entry's `template` MUST interpolate
  `${stream.filters.<field>.value}` for the field/operator entry it is
  declared on, and MUST NOT interpolate any other `stream.filters.*`
  reference.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A `template` is a full value-expression string, checked only for known
  placeholder scopes (RULE-ENDP-069) — a constant (`"status:active"`) names
  no placeholder at all, and a template referencing a different field's
  filter value names one that RULE-ENDP-069 already accepts as known;
  neither is caught by that check. Either shape sends the same rendered value to
  the provider whatever the stream's actual filter carries: every value for
  that field/operator produces one request, and a run can return silently
  incorrect rows with no finding anywhere. `${stream.filters.<field>.value}`
  is the one placeholder form that ties the rendered value back to the
  filter this entry exists to express, so its absence is refused at
  authoring time rather than left to a run to discover. A template naming
  the required placeholder alongside a second `stream.filters.*` reference
  (a typo'd field, or a real one this map does not declare a landing for)
  passes the same way: the required token is present, RULE-ENDP-069 accepts
  the extra token as a known scope, and nothing resolves it — the resolver
  substitutes an empty string for an unresolved reference, silently sending
  a malformed or narrowed value. A `filters` template's only dependency is
  the entry it is declared on.

  This address is this repo's own invention, not a read of engine behaviour:
  the engine's resolver has no `stream` scope today, and a template landing's
  run-time resolution is unbuilt (the wider gap `TemplateFilterLanding`
  itself is disposed against). If the engine settles on a different address
  for a template-landing's current value once that lands, every document
  authored against this exact placeholder stops resolving and this
  statement must move with it.
status: active
superseded_by: null
