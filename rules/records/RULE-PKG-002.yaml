id: RULE-PKG-002
statement: >
  A database connector's repository root MUST be its importable Python
  package: the definition documents sit under `definition/`, and
  `__init__.py`, `connector.py`, `requirements.txt` and `pyproject.toml`
  sit at the root beside it.
tier: process
severity: error
scopes: [connector-package]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, engine]
rationale: >
  The engine resolves a connector's class through the entry point its
  installed distribution declares, never by walking the repository tree, so
  a conventional nested source layout (`src/<package>/`, mapped correctly in
  `pyproject.toml`) builds a wheel with the same importable module and the
  same entry points a flat-root layout would — indistinguishable to
  everything downstream. The layout is a directory tree on disk, not a
  document any contract model parses. Known enforcement gap: registry CI's
  `pip wheel --no-deps .` build and every conformance-kit check reach the
  package only through its installed entry points, so none of them can see
  whether the repository root itself was the package or a wrapper around
  one.
status: active
superseded_by: null
