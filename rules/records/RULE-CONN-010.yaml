id: RULE-CONN-010
statement: >
  A `sidecar:` pointer MUST name an entry in a credentials file keyed by
  connection-contract input name, never a key of the env-var-keyed template the
  plugin emits.
tier: reference
severity: error
scopes: [connection]
validator: null
enforcement_location: unenforced
owners: [pipeline-plugin, engine]
targets: [ConnectionAuthored, ConnectionInput]
rationale: >
  The plugin's credentials template and a sidecar credentials file look alike
  and resolve nothing alike. The template is keyed by env-var name and is read
  by nothing — the user exports it, and `env:` pointers pick the values up out
  of the environment — while a sidecar file is read by the engine directly and
  keyed by the same contract input name that keys `secret_refs`. Alone among
  the pointer schemes, `sidecar:` constrains nothing after its prefix, so a
  pointer aimed at the wrong file validates cleanly. Known enforcement gap:
  the engine checks only that the named key is present in the sidecar file,
  never that it is the correct contract-input name — a pointer naming the
  wrong key resolves without complaint whenever the sidecar file happens to
  carry an entry under that name too (the env-var template's own key
  spelling, say), and fails with a missing-entry error only when it does not.
  Neither outcome is the engine checking the agreement this rule states.
status: active
superseded_by: null
