id: RULE-TMAP-009
statement: >
  A write `regex` rule's arrow_type matcher MUST compile under the RE2 regex
  dialect with any named capture spelled `(?<name>…)`, and the native_type DDL
  it renders MUST carry only well-formed placeholders.
tier: shape
severity: error
artifact_kinds: [type-map]
validator: "analitiq.contracts.type_map::TypeMapWriteRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapWriteRegexRule]
rationale: >
  The write direction inverts which key is the matcher, so the regex dialect
  obligation moves onto `arrow_type` while the placeholder obligation moves onto
  `native_type` — an author carrying a read rule's habits across writes the right
  syntax in the wrong key. The engine compiles that matcher with RE2 when it
  loads the connector, so a pattern that does not compile is not a narrower
  match: the whole map is refused at load, before any DDL is rendered and on
  runs that would never render any. RE2 also takes Python's `(?P<name>…)`
  spelling; this contract takes only `(?<name>…)`, the same spelling a read
  rule takes, which makes it the contract's choice rather than the dialect's. This states the engine as it stands: it first validates the map
  against the contract-model release it pins, which runs this same gate, and
  then compiles the matcher with RE2. The gate is only as close to RE2 as the
  dialect it compiles with. A matcher the gate admits and RE2 cannot parse
  passes authoring and is refused at load. One the gate refuses and RE2 would
  take is refused at load too, by the engine's own copy of the gate, and becomes
  a usable map rejected only when this gate and the release the engine pins
  compile with different dialects.
status: active
superseded_by: null
