id: RULE-TMAP-009
statement: >
  A write `regex` rule's arrow_type matcher MUST compile under the RE2 regex
  dialect with any named capture spelled `(?<name>…)` and no zero-count
  repetition, and the native_type DDL
  it renders MUST carry only well-formed placeholders.
tier: shape
severity: error
artifact_kinds: [type-map]
validator: "analitiq.contracts.type_map::TypeMapWriteRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapWriteRegexRule]
rationale: >
  The write direction inverts which key is the matcher, so the regex dialect
  obligation moves onto `arrow_type` while the placeholder obligation moves onto
  `native_type` — an author carrying a read rule's habits across writes the right
  syntax in the wrong key. The engine compiles that matcher with RE2 when it
  loads the connector, so a pattern that does not compile is not a narrower
  match: the whole map is refused at load, before any DDL is rendered and on
  runs that would never render any. RE2 also takes Python's `(?P<name>…)`
  spelling; this contract takes only `(?<name>…)`, the same spelling a read
  rule takes, which makes it the contract's choice rather than the dialect's.
  A zero-count repetition is refused
  for the same reason: what it repeats is never matched, so it can only be an
  authoring mistake, and reading past it would mean redoing RE2's choice of
  which operand a repetition applies to. This states the engine as it stands: it validates the map
  against the contract models and then compiles the matcher with RE2. The gate
  compiles with RE2 as well, so the two agree while their RE2 releases parse
  the same syntax. Where the engine's release accepts a construct the gate's
  refuses, the gate is stricter than the run and rejects a matcher that would
  load; where it refuses one the gate's accepts, the matcher passes authoring
  and is refused at load.
status: active
superseded_by: null
