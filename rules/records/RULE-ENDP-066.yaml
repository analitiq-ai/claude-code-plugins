id: RULE-ENDP-066
statement: >
  A param declared `required` MUST declare a source its operation can supply
  the value from: its own `default`, or — on a read — the `operators` that
  make it stream-filterable, a pagination block that gives it a starting
  value, or a replication block that supports `incremental`.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation, WriteOperation]
rationale: >
  `required` says the operation is wrong without the value, and the document is
  what has to be able to supply it. Every declared param is bound by exactly
  one request binding, and the value that binding carries reaches it from the
  param's own `default`, from a stream filter, or from a pagination or
  replication block. `operators` and those blocks are read-side, so a write
  param has only its `default` — the argument RULE-ENDP-028 also makes, about
  a write path_param whether or not it is required, so neither rule contains
  the other. A required param with none of them resolves to nothing on every
  run, while the document says in the same breath that the operation is wrong
  that way. That contradiction is settled by reading one document, which is why
  it is refused where it is written rather than left to a run to discover.
  Being driven by a block is not the same as being given a value by one: a
  `controlled_by` marker is self-declared, only the block-to-param direction is
  checked anywhere, and a block can name a param and leave it with nothing.
  What that looks like differs by block, which is why the two are stated apart.
  A pagination strategy declares the first request's value, so a page size with
  no `default`, a keyset or an offset or page cursor whose `initial` carries no
  value, and an opaque cursor, which has no field for one because there is no
  cursor before the first page, each name a param and fill it never. A
  replication block declares no such value anywhere: its cursor comes from the
  state a run stores, so what decides is `supported_methods`, and one that
  never says `incremental` says no run will leave a cursor behind. Counting a
  mention would be worse than not checking, because the refusal names the
  blocks as a way out and an author would take it. What the refusal proves is that a source
  is DECLARED, never that it resolves: a `default` reffing a connection
  parameter the connection leaves unset, and a filterable param no stream
  filters, both pass, and RULE-ENDP-067 is the obligation over that remainder.
  Nothing in the check reads `required` back out of any consumer, so it stays
  correct however the flag comes to be honoured; what `operators` rests on is
  the registry service's comparison of a stream's filter against the operators
  the param declares, the same consumer RULE-STRM-026 names.
status: active
superseded_by: null
