id: RULE-ENDP-066
statement: >
  Two entries in a read operation's filter map MUST NOT bind the same parameter.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
rationale: >
  A parameter is one slot holding one value, so two entries binding it are two
  comparisons the request has no way to distinguish: the operator an author
  wrote is not the one the provider performs, and the stream reads the rows of
  whichever comparison the parameter means. That is the failure the map exists
  to make unrepresentable, and the reason the operator is a key rather than a
  flag. The parameter alone decides it, and deliberately: keyed on the
  parameter and its rendered value instead, the rule would be defeatable by
  re-spelling one side of a pair — a ref to the filter's value, a template
  interpolating it and nothing else, and an omitted value are one wire value
  under three spellings. It is checked across the whole map rather than per
  field because two fields binding one parameter collide for the same reason
  two operators do.
status: active
superseded_by: null
