id: RULE-ENDP-002
statement: >
  A `filters` map entry's landing site — `from_param`, or `param` on a
  template landing — MUST NOT name a param controlled by pagination or
  replication.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A `controlled_by` param's value is set by the paging or incremental
  machinery on every request; landing a filter operator on it hands the
  runtime a value it immediately overwrites, so the stream's predicate
  vanishes from the request and the run reports success over unfiltered
  data. Refusing the entry at authoring time is cheaper than discovering the
  silent overwrite after the run.
status: active
superseded_by: null
