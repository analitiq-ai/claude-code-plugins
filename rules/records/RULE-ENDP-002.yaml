id: RULE-ENDP-002
statement: >
  A parameter declared as controlled by pagination or replication MUST NOT also
  declare the operator set that makes it stream-filterable.
tier: structural
severity: error
scopes: [api-endpoint]
validator: null
owners: [connector-plugin, engine]
targets: [Param]
rationale: >
  Taken when a parameter carried its own operator set, and retired with that
  set: filterability is no longer a parameter's to declare, so there is no
  longer a shape on one parameter object for this rule to be a conditional over.
  The obligation it stood for — one value with two authorities, a stream's
  predicate and a runtime control writing the same slot — survives against the
  read operation's filter map instead, where both halves are in view.
status: retired
superseded_by: RULE-ENDP-067
