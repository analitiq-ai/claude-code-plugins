id: RULE-ENDP-002
statement: >
  An operator MUST NOT name as its landing site a parameter declared as
  controlled by pagination or replication.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::_validate_filters_wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A landing site is where the stream's value is written on the way to the wire;
  marking the param controlled hands that same slot to the paging or incremental
  machinery, which sets it on every request. Naming one as an operator's landing
  site advertises a filter the runtime overwrites, so the stream's predicate
  vanishes from the request and the run reports success over unfiltered data.
  Both halves are in view on the read operation, which is why the check sits
  there rather than on the param.
status: active
superseded_by: null
