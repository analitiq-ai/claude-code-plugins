id: RULE-CTOR-037
statement: >
  A connector, or a stream binding, for a connector kind the engine does not
  execute MUST be declined with a structured refusal rather than authored,
  even though the contract accepts the kind.
tier: process
severity: error
artifact_kinds: [connector, stream]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  Authoring one produces an artifact that passes every check here and can
  never run, and the refusal is what tells the user the gap is platform
  support rather than something they can fix in their document — a
  half-authored connector left in the registry says the opposite. Which
  kinds the engine executes is engine state no artifact here tracks: the
  contract models accept every declared kind, so this is plugin policy that
  an engine release retires with nobody editing the prose. Known enforcement
  gap: nothing here or downstream refuses a declared kind the engine no
  longer executes — closing it would take the engine publishing its
  supported-kind set the way it already publishes the Arrow type grammar,
  which does not exist for connector kinds today.
status: active
superseded_by: null
