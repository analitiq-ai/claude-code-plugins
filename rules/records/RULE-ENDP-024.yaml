id: RULE-ENDP-024
statement: >
  A `from_input` path_params binding MUST NOT appear on a read operation,
  and on a write MUST address one dotted record field that the mode's input
  schema declares, never the whole record and never the batch.
tier: advisory
severity: error
scope: api-endpoint
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation, WriteOperation]
rationale: >
  A URL segment holds one value, so the binding forms that address a
  structure or a batch have nothing to substitute — and the engine
  substitutes whatever it is handed, so a whole record reaches the provider
  stringified into the path and the request addresses a resource that does
  not exist. The membership half is the one that bites in practice: a
  renamed or mistyped record field leaves a placeholder bound to nothing,
  which is the same wrong URL with no error anywhere, so the binding is
  checked against the mode's own input schema at authoring time. On a read
  there is no record in scope when the request is built, which is why the
  binding is refused outright there rather than checked.
status: active
superseded_by: null
