id: RULE-PIPE-010
statement: >
  The order of a pipeline's `streams` MUST NOT encode a dependency between
  streams, and MUST NOT be presented to the user as one.
tier: process
severity: error
artifact_kinds: [pipeline]
validator: null
enforcement_location: authoring-practice
owners: [pipeline-plugin, engine]
targets: [PipelineAuthored]
rationale: >
  Every permutation validates identically and the runtime is free to ignore
  the order entirely, so an array arranged to mean "load the dimensions before
  the facts" produces wrong results non-deterministically, and nothing —
  including a reviewer reading the document alone — can tell that arrangement
  from an arbitrary one; only asking the author what they intended can. The
  second half of the rule is squarely a reviewer's to catch: whatever
  documentation or UI text a plugin presents to the user about a pipeline is
  readable, and a reviewing agent checks it for a promise this ordering does
  not keep.
status: active
superseded_by: null
