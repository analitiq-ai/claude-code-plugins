id: RULE-TMAP-004
statement: >
  A read rule whose native_type pattern captures a declared parameter MUST carry
  that capture into its arrow_type render rather than rendering an Arrow type
  whose parameters are all fixed.
tier: advisory
severity: error
scopes: [type-map]
validator: "analitiq.contracts.type_map::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapReadRegexRule]
rationale: >
  Capturing a column's declared precision and then discarding it collapses
  every column in the family onto one width, so a narrow column is widened and
  a wide one silently loses digits at the destination — and the map still reads
  as if it handled the family. A fixed default is legitimate only on the
  unparameterized fallback rule, where nothing was declared to preserve. The
  detector keys on the arrow_type's parentheses, so a capture dropped into a
  Arrow type that carries no parameters at all is out of its reach.
status: active
superseded_by: null
