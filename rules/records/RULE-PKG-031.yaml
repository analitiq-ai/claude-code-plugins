id: RULE-PKG-031
statement: >
  An endpoint document MUST ship at `endpoints/{endpoint_id}.json` under the
  connector release or the connection that carries it, directly in that
  directory rather than in a subdirectory of it.
tier: referential
severity: error
scope: connector-package
validator: "analitiq.validator.connectors::endpoint_filename_findings"
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  The engine resolves an endpoint by id and reaches the file by its name, so a
  document whose filename and `endpoint_id` disagree is unreachable under the id
  every stream pins it by — and it is unreachable silently, because the file is
  present and valid and the id it declares is fine. Nesting fails the same way:
  the gate that walks the directory reads it flat, so a document one level down is not
  refused, it is simply never seen. Both are the kind of mistake a rename makes
  and a review does not catch, because the two halves of the identity are never
  on screen together.
status: active
superseded_by: null
