id: RULE-STRM-022
statement: >
  Every field name a stream references MUST resolve to a field the endpoint
  document on that side of the transfer declares.
tier: reference
severity: error
scopes: [stream]
validator: null
enforcement_location: unenforced
owners: [pipeline-plugin, engine]
targets: [StreamSource, Filter, AssignmentTarget, DatabaseConflictKeyedWrite]
rationale: >
  The declaring endpoint document is not part of the stream, so no
  in-process check can resolve a name — the local validator proves only that
  a name is well-formed. What resolves it at run time is uneven, not
  reliable across the names this rule covers: for an API source the engine
  checks a filter's field and the cursor field against the endpoint's
  declared operation before the first request, but a SQL source never
  compares its selected columns, a filter field or the pagination order-by
  field against the endpoint's actual columns, and a mapping's destination
  target is the worst case — an unmatched `target.path` is not an error at
  all, the field is silently dropped from the write. A typo therefore
  surfaces, where it surfaces, as an ordinary database or provider error
  unrelated to this rule, or as data quietly missing from the destination.
  Catching one before that means reading the name back against the endpoint
  document that declares it, or back to the user rather than guessing it.
status: active
superseded_by: null
