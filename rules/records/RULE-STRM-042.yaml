id: RULE-STRM-042
statement: >
  A connector-scoped endpoint reference SHOULD name an endpoint the referenced
  connector publishes.
tier: referential
severity: warning
scopes: [stream]
validator: "analitiq.validator.trees::_check_connector_endpoint_refs"
owners: [pipeline-plugin]
rationale: >
  A connector's endpoint set is the connector's to define, pinned by version at
  run time, so a reference to an endpoint it does not publish is a stream
  defect and the stream is what gets realigned — never the connector. It is a
  warning because the check can only see the endpoint documents the author has
  beside the pipeline: a connector whose endpoints were never downloaded has an
  unknown set, not an empty one, and is skipped rather than warned on, so a
  clean result is not proof the endpoint exists. The finding carries the
  closest published name so the realignment is a choice, not a search.
status: active
superseded_by: null
