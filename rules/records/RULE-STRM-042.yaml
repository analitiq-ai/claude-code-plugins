id: RULE-STRM-042
statement: >
  A connector-scoped endpoint reference MUST name an endpoint published by the
  connector behind the connection it references.
tier: referential
severity: error
scopes: [stream]
validator: "analitiq.validator.trees::_check_connector_endpoint_refs"
owners: [pipeline-plugin, engine]
rationale: >
  The engine resolves a connector-scoped reference to an endpoint document
  under the connector materialised for the run, eagerly for every stream while
  the pipeline loads, so a reference to an endpoint the connector does not
  publish fails the whole run before a record moves — and the stream is what
  gets realigned, never the connector. That cost is the severity. The finding is
  emitted at warning severity all the same, because the check sees only the
  endpoint documents the author has beside the pipeline: a connector whose
  endpoints were never downloaded has an unknown set, not an empty one, and is
  skipped rather than warned on, and a downloaded set is the author's copy
  rather than the one the run will materialise. So a
  finding is a prompt to confirm against the connector, not proof the endpoint
  is absent, and a clean result is not proof it exists. The finding carries the
  closest published name so the realignment is a choice, not a search.
status: active
superseded_by: null
