id: RULE-ENDP-065
statement: >
  Every operator a filterable field offers MUST name the declared parameter its
  comparison is written to, and no parameter may be named by more than one
  operator in the operation.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::_validate_filters_wiring"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A request binding maps a wire name to one value. So a parameter named by two
  operators describes one request for two different comparisons, and the
  document stops recording which one was asked for — individually each entry is
  well-formed, which is why the collision is only visible from the operation and
  not from either entry. The same holds across fields, not merely within one:
  two fields reaching for one parameter collide exactly as two operators on one
  field do. An operator naming no parameter has nowhere in the request to be
  written at all. Both halves are defensible from the contract alone — they ask
  only that the document say where each comparison goes, which nothing
  downstream can reconstruct if it does not. Read as a statement about a run, it
  is a reading of the engine as it stands: if the engine ever gained a way to
  carry a comparison the document does not place, this rule would refuse
  documents that engine could run, so it fails as a refusal at authoring time
  and never as a bad read.
status: active
superseded_by: null
