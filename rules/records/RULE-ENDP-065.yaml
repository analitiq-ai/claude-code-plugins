id: RULE-ENDP-065
statement: >
  A field of a read operation's record shape MUST carry its canonical Arrow
  type on the field node itself, not only behind a `$ref` or a composition
  keyword.
tier: referential
severity: error
scopes: [api-endpoint]
validator: "analitiq.validator.connectors::_unreadable_record_field_findings"
owners: [connector-plugin, engine]
rationale: >
  An embedded schema may use `$ref` and composition — the contract says how
  (RULE-ENDP-026) and resolves both when it grades a document. The engine does
  neither: it reads a field node's own `type`, `arrow_type`, `properties` and
  `items`, follows no reference, and builds the record batch from what it
  found. A field declared behind a reference is therefore invisible to the one
  consumer the declaration exists for, and the run fails on a field the
  document plainly types. It is the validates-clean-and-breaks shape the
  recorded-sample rules close for a field's VALUE, one layer out at its
  declaration, and it is caught here rather than in the models because the
  reachable shape is a fact about the engine's reader rather than about the
  document.
status: active
superseded_by: null
