id: RULE-CONN-005
statement: >
  A connection MUST NOT author a value into its `discovered` map, which the
  connections service owns and fills from the connector's post-auth discovery.
tier: procedural
severity: error
scope: connection
mechanized: false
validator: null
owners: [pipeline-plugin, engine]
targets: [ConnectionStoredMaps, ConnectionInput]
rationale: >
  `discovered` holds what the provider itself returned after authentication, so
  a hand-written value is a claim about the provider that nobody asked the
  provider for — usually a placeholder invented to make a draft connection look
  ready to activate, which is exactly the state the map exists to report
  honestly. It is a declared field of the connection model, so a
  client-supplied value validates here and is refused only when the connections
  API ingests the document; catching it sooner means knowing which side
  produces the map, and the document records nothing about its own origin.
status: active
superseded_by: null
