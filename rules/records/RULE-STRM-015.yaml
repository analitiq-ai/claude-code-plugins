id: RULE-STRM-015
statement: >
  A validation rule's field MUST resolve within its own mapping: the first
  token naming an assignment target the mapping declares, and each later
  token a field declared beneath the one before it.
tier: advisory
severity: error
scopes: [stream]
validator: "analitiq.contracts.stream::StreamMapping._validate_rule_fields_resolve"
owners: [pipeline-plugin]
targets: [StreamMapping]
rationale: >
  Validation grades the mapped output, so a rule naming a source field —
  the mistake to expect wherever a source and destination name differ — or
  simply mistyping a token addresses nothing and grades no value, which is
  indistinguishable from a rule that passed. Only the mapping holds both the
  targets and the rules, so it is the one place resolution is possible.
  Any target in the mapping is addressable, not only the enclosing
  assignment's, because the rules grade the record the assignments build
  together.
status: active
superseded_by: null
