id: RULE-STRM-028
statement: >
  An assignment target's arrow_type MUST reproduce the destination column's
  declared type exactly, its parameters included.
tier: referential
severity: error
scopes: [stream]
validator: null
owners: [pipeline-plugin, engine]
targets: [AssignmentTarget]
rationale: >
  The destination column's declared type sits in the endpoint document the
  stream references, so a target that agrees on the family and differs in
  its parameters — a different precision or scale, a different unit or
  timezone — passes every local check, since the type pattern grades the
  string's form and not its agreement with anything. What it produces is a
  cast the engine performs at the write, silently rounding or overflowing
  data that looked correctly mapped. Catching a violation means reading the
  destination column's type string beside the target's, in full.
status: active
superseded_by: null
