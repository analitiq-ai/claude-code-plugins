id: RULE-PKG-029
statement: >
  The mode vocabulary a connector's `ssl_mode` input declares and the
  vocabulary its dialect's TLS hook interprets MUST be the same set: every
  declared mode is one the dialect handles, and the dialect handles no mode
  the input does not declare.
tier: referential
severity: error
scope: connector-package
mechanized: false
validator: null
owners: [connector-plugin, engine]
rationale: >
  The vocabulary is the system's own, researched from the driver's docs and
  never translated, so nothing derives one half from the other — the author
  holding both in mind at once is the only link. A declared mode the
  dialect does not handle reaches the CDK base and raises at connect for
  whichever user selects it; a mode the dialect handles but the input never
  offers is dead code standing in for a gap in the enum. The mode set is
  authored into `connector.json` while its interpretation lives in the
  package's dialect hook, no validator opens the dialect, and the
  contract's TLS block is deliberately vocabulary-agnostic.
status: active
superseded_by: null
