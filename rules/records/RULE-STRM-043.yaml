id: RULE-STRM-043
statement: >
  A stream source that replicates incrementally and declares
  `database_pagination.order_by_field` MUST name its `cursor_field` there.
tier: coherence
severity: error
artifact_kinds: [stream]
validator: "analitiq.contracts.stream::StreamSource._pages_are_ordered_by_the_cursor"
owners: [pipeline-plugin, engine]
targets: [StreamSource]
fixture_model: StreamSource
rationale: >
  A checkpoint records the cursor value of the last row of a page, and that
  value is the highest one read only when the page was ordered by the cursor.
  Under any other ordering the run saves an arbitrary row's value, and the
  next run resumes above rows it never read — data loss with no failure
  anywhere, visible only as records that never arrive. The two fields sit in
  one document and disagreeing is decidable from it alone, so refusing the
  stream is the only point at which the author still has both halves in
  front of them; a full-refresh source reads no cursor, so its ordering is
  free.
status: active
superseded_by: null
