id: RULE-PKG-006
statement: >
  A database connector's `pyproject.toml` MUST declare its dependencies
  dynamically from `requirements.txt` rather than restating them, so
  `requirements.txt` stays the only place the driver is pinned.
tier: structural
severity: warning
scope: connector-package
mechanized: false
validator: null
owners: [connector-plugin]
rationale: >
  A hand-restated dependency list is a drift surface: it builds a perfectly
  valid wheel, so registry CI passes it, and the divergence appears only
  once someone bumps the driver in one file and the installed connector
  keeps resolving the other. `pyproject.toml` is a package file no contract
  model parses and nothing compares the two lists, so a stale pin is the
  first and only symptom.
status: active
superseded_by: null
