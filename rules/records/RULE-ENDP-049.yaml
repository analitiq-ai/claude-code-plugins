id: RULE-ENDP-049
statement: >
  Every `${...}` placeholder in a template expression MUST begin with a
  declared resolution scope.
tier: structural
severity: error
scope: api-endpoint
validator: "analitiq.contracts.endpoints::TemplateExpression._placeholders_qualified"
owners: [connector-plugin]
rationale: >
  An unqualified placeholder resolves to the empty string rather than failing,
  so the request is built and sent with a hole in it — a URL missing a path
  segment, a header missing its token — and what comes back is a remote error
  about something else. The scope prefix is what tells the resolver where to
  look, so omitting it is not shorthand for a default: there is no default,
  and the runtime has nothing to report because nothing went wrong from where
  it stands. Refusing the document is the only place the mistake is still
  attached to the line that made it.
status: active
superseded_by: null
