id: RULE-CONN-012
statement: >
  A connection's scoped type-map documents MUST NOT use the pre-split
  type-map.json filename; the engine reads the read direction only from
  type-map-read.json and the write direction only from type-map-write.json.
tier: reference
severity: error
artifact_kinds: [connection]
validator: "analitiq.validator.document_set::_connection_type_map_findings"
owners: [pipeline-plugin, engine]
rationale: >
  A connector ships its type maps beside connector.json, and RULE-PKG-030
  already rejects the pre-split filename there; a connection scopes its own
  type maps the identical way beside connection.json, and the engine reads
  them by the same two split filenames, never the pre-split one, at either
  scope. Without this rule a connection carrying the old filename passes
  every check a connection document can make on its own — the filename is not
  a field on any model — and the map is silently unread at run time, which a
  connector's own coverage check would have caught wearing the connector's
  hat but nothing catches wearing the connection's.
status: active
superseded_by: null
