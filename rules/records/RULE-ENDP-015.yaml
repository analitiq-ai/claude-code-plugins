id: RULE-ENDP-015
statement: >
  A write mode MUST NOT declare both an idempotency key placement and batching.
tier: structural
severity: error
scope: api-endpoint
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/endpoints.py::WriteOperation._wiring"
owners: [connector-plugin, engine]
targets: [WriteOperation]
rationale: >
  An idempotency key identifies one record's write attempt, and a batched
  request carries many, so there is no value the key could take. Worse, a
  resumed run re-batches a different composition of rows, so a key attached to a
  batch does not survive an engine restart and the retry re-writes rows the
  provider already accepted. When a provider documents both a key and a batch
  cap, the key is the safer choice unless the operator is explicitly buying
  throughput. The obligation is a mutual presence exclusion on one write-mode
  object, mirrored declaratively into the published schema.
status: active
superseded_by: null
