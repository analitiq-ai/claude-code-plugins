id: RULE-ENDP-061
statement: >
  A request's `path` MUST NOT carry a `${...}` template expression; the only
  substitution into a path is the `{name}` placeholders `path_params` binds.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::_RequestBase._validate"
owners: [connector-plugin, engine]
targets: [_RequestBase]
fields: [path]
mechanism: pattern
fixture_model: WriteRequest
rationale: >
  RULE-SHRD-006 states the general form — a `${...}` resolves only where the
  value-expression grammar says it does — and in most slots a shape cannot say
  whether the author meant the characters or a template. A path can: no part of
  it is an opaque slot where a template could have been intended, so this is
  that rule applied where the answer is decidable. What it prevents: nothing
  resolves a path, so the template is never expanded, and what is left collides
  with the `{name}` syntax around it — the inner span reads as a placeholder
  name, leaving a URL that either carries a stray sigil beside a correctly bound
  value or names a placeholder nothing binds. Neither is the path the author
  wrote. The idiom is borrowed from the request slots where a template does
  resolve, which is exactly why the path is checked rather than trusted.
status: active
superseded_by: null
