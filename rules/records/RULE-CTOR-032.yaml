id: RULE-CTOR-032
statement: >
  A connector's first release MUST declare `version` as `1.0.0`.
tier: procedural
severity: info
scope: connector
validator: null
owners: [connector-plugin]
rationale: >
  Every later version is computed as a bump from the previous release by the
  drift classifier, so the first one is the only version anybody picks
  outright; start it anywhere else and the series reads as though releases
  are missing, or as though the connector is pre-release when it is not.
  Nothing records the starting point — `version` accepts any semantic
  version, so a first release cut at another number validates identically
  and only the registry's release history shows the anomaly.
status: active
superseded_by: null
