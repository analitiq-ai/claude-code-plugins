id: RULE-PIPE-006
statement: >
  A pipeline MAY omit any schedule field `Schedule` declares a default for,
  and a document that omits one takes that default.
tier: structural
severity: info
scope: pipeline
validator: "packages/contract-models/src/analitiq/contracts/pipelines/config.py::Schedule.type"
owners: [pipeline-plugin]
targets: [Schedule]
fields: [type, timezone]
mechanism: default
rationale: >
  Authors read an absent schedule block as "this pipeline has no schedule at
  all" and defensively write the default values out to be explicit. That is
  the permission worth stating: the omission is complete and means exactly the
  same thing, while the written-out copy freezes today's value into the
  document and hides that the contract owns it (RULE-SHRD-004 is the general
  form). The defaults are declared on the model and published in the JSON
  Schema, so a reader wanting the values reads them there.
status: active
superseded_by: null
