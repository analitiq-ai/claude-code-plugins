id: RULE-TMAP-016
statement: >
  Every `${name}` a write rule's rendered native_type substitutes MUST name a
  capture group its own `arrow_type` matcher declares.
tier: coherence
severity: error
artifact_kinds: [type-map]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, pipeline-plugin, engine]
targets: [TypeMapWriteRegexRule]
rationale: >
  This is the read side's capture-backing obligation with the keys swapped, and
  the swap is the trap — the placeholders move to `native_type` and the captures to
  `arrow_type`, so a rule copied across directions keeps both in the wrong
  place and still parses. Only the read direction's backing is checked here;
  the write correspondence is first exercised when the engine renders DDL,
  which no document in this repo holds — and, first-match-wins being what it
  is, only if this rule is the one that actually matches and no earlier rule
  shadows it. A rule an author never sees fire, because it is shadowed or its
  Arrow family never occurs in synced data, carries an unbacked placeholder
  indefinitely with nothing ever reaching it to raise.
status: active
superseded_by: null
