id: RULE-ENDP-030
statement: >
  A write operation's response expressions MUST read `response` only through
  the scopes a write response carries — `body`, `headers`, `status` and
  `metadata` — and so MUST NOT reference `response.record_count`,
  `response.records` or any other sub-scope.
tier: coherence
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::WriteResponse._reads_only_write_scopes"
owners: [connector-plugin, engine]
targets: [WriteResponse]
fields: [success_when, error, affected_records, generated_keys, metadata]
fixture_model: WriteResponse
rationale: >
  A write's declared response is read against the scope the provider's
  answer fills: its body, its headers, its status, and the metadata keys the
  block itself declares. The record count and the records belong to a read's
  page, so a write-side reference to either names nothing, and neither does
  a misspelled sub-scope. As the engine reads it today, such a reference is
  refused when the write plan is built, before the first batch; without that
  refusal it would resolve to nothing on every response, and a
  `success_when` built over it would decide nothing about what the provider
  said. The author is usually adapting a read response block to the write
  side, where those scopes silently stop existing. The closed set is stated
  here rather than inferred from the read side's reserved scopes, so a scope
  added to reads does not become readable on writes by accident.
status: active
superseded_by: null
