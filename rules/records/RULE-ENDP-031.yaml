id: RULE-ENDP-031
statement: >
  A `database_object` MUST omit a namespace qualifier the provider does not
  have, and MUST NOT declare that absence as an explicit null.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::DatabaseObject._reject_explicit_null_namespaces"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [DatabaseObject]
rationale: >
  Identifiers here are stored verbatim from introspection, so the object's
  identity is exactly what the document says it is. Admitting both an omitted
  key and a null one would give "this provider has no such level" two spellings,
  and every consumer joining, comparing or rendering an object identity would
  have to handle both — the class of bug where the same table appears twice
  under two keys. Refusing the null also stops a discovery path that emitted one
  by accident from being read as a real, empty namespace.
status: active
superseded_by: null
