id: RULE-TMAP-015
statement: >
  A write rule's `arrow_type` matcher MUST be spelled in the casing the
  canonical Arrow vocabulary uses, because write-side matching preserves case
  where read-side matching does not.
tier: process
severity: warning
scopes: [type-map]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, pipeline-plugin, engine]
targets: [TypeMapWriteExactRule, TypeMapWriteRegexRule]
rationale: >
  Case handling belongs to the reader, and the reader normalizes only on the
  read side — so an author who learned that casing does not matter learns it
  from the direction where it genuinely does not. A mis-cased `exact`
  arrow_type is rejected outright by the Arrow type pattern; a mis-cased
  `regex` arrow_type is structurally a valid pattern, validates with no
  findings at all, and simply never fires. Known enforcement gap for that
  case: whether it ever hard-errors depends on map order and on whether the
  family it silently fails to match is ever actually written — a later rule
  matching first, or the family simply never occurring in synced data, lets
  the mis-cased rule sit unfired and unnoticed indefinitely.
status: active
superseded_by: null
