id: RULE-CTOR-023
statement: >
  A connector document's `connector_id` MUST match the slug pattern
  `ConnectorBase.connector_id` declares.
tier: structural
severity: error
scopes: [connector]
validator: "analitiq.contracts.connector::ConnectorBase.connector_id"
owners: [connector-plugin, engine]
targets: [ConnectorBase]
fields: [connector_id]
mechanism: pattern
symbol: "analitiq.contracts.shared.common::SLUG_PATTERN"
rationale: >
  `connector_id` is the connector's identity in every direction at once — the
  registry repo and on-disk directory name, the entry-point name the package
  registers under, and the key the engine resolves a concrete class by once
  `kind` has picked the family — so it has to stay addressable as a path
  segment, a Python identifier fragment and a URL segment simultaneously. An
  author reaching for a human-readable label here produces a connector that
  validates as a document and cannot be resolved, installed or checked out;
  the pattern is what keeps a display name from becoming an identity.
status: active
superseded_by: null
