id: RULE-STRM-017
statement: >
  A stream's replication block MUST take the shape its method selects and
  carry only the fields that shape declares.
tier: structural
severity: error
scope: stream
mechanized: true
validator: "packages/contract-models/src/analitiq/contracts/stream.py::FullRefreshReplication"
owners: [pipeline-plugin]
targets: [FullRefreshReplication, IncrementalReplication]
mechanism: discriminated_union
rationale: >
  A watermark is meaningful only where the read resumes, so binding those
  fields to the branch that resumes stops an author declaring a cursor a
  full refresh would ignore, and stops an incremental read being authored
  with no watermark at all. The rejection names the field rather than this
  rule, so the id is what a reader follows to learn that the branch, not the
  field, was the wrong choice.
status: active
superseded_by: null
