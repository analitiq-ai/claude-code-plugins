id: RULE-ENDP-071
statement: >
  Two `filters` map entries anywhere in the map MUST NOT resolve to the
  same landing site.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fields: [filters]
rationale: >
  A landing site — a param, whether it carries the filter's own value or a
  template-computed one — carries one value. Two entries bound to the same
  one is the ambiguity this map exists to close, whether they are two
  operators on one field or two different fields entirely: nothing else
  checks whether `eq`, `contains` and `starts_with` build the request
  identically, so a run over the wrong operator would succeed silently;
  the same silent collision happens when a second, unrelated field's
  filter overwrites the first's value on the same param. Refusing
  the entry at authoring time is where the mistake is still attached to the
  line that made it.
status: active
superseded_by: null
