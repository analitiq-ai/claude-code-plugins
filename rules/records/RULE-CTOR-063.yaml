id: RULE-CTOR-063
statement: >
  A transport's `tls` values MUST be declarations the runtime resolves to plain
  strings, never a driver-specific object, a filesystem path, or code;
  converting a resolved mode into driver connect arguments belongs to the
  connector package's dialect.
tier: shape
severity: error
artifact_kinds: [connector]
validator: null
enforcement_location: authoring-practice
owners: [connector-plugin, engine]
targets: [DatabaseTls]
rationale: >
  The TLS slots are untyped value-expression carriers, so a driver object or a
  path parked in one is a well-formed document. The engine does refuse a
  resolved value that is not a plain string before it reaches the connector
  package's dialect, which closes the case an author reaches for most often:
  copying the object every driver's own documentation shows. It cannot close
  the quieter half — a plain string that is nonetheless the wrong content, a
  filesystem path where the mode vocabulary is expected, or a fragment of code
  serialized as text — because the fields are typed open precisely so the mode
  vocabulary can stay the connector's own, and no generic check can tell a
  legitimate mode string from a wrong one without knowing that connector's
  driver semantics.
status: active
superseded_by: null
