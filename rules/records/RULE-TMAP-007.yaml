id: RULE-TMAP-007
statement: >
  A `${` opening a placeholder in an arrow_type render MUST be closed around a
  non-empty name.
tier: shape
severity: error
scopes: [type-map]
validator: "analitiq.contracts.type_map::TypeMapReadRegexRule._check"
owners: [connector-plugin, pipeline-plugin]
targets: [TypeMapReadRegexRule]
rationale: >
  A malformed placeholder names no capture, so substitution leaves it in place
  and the rule renders an arrow_type carrying literal `${` text that no Arrow
  parser accepts. Nothing about the surrounding string looks wrong, and the
  well-formedness check is what lets `RULE-TMAP-003`'s capture-backing check
  read the render at all.
status: active
superseded_by: null
