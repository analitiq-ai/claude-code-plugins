id: RULE-ENDP-029
statement: >
  A write response's metadata key MUST match the contract's metadata-key
  pattern and MUST NOT collide with a reserved response-scope name.
tier: structural
severity: error
scope: api-endpoint
validator: "analitiq.contracts.endpoints::WriteResponse._metadata_keys"
owners: [connector-plugin, engine]
targets: [WriteResponse]
rationale: >
  A metadata key becomes an addressable name in the response scope, so one
  that collides with a scope the engine already owns creates two meanings
  for the same reference and the author's extraction is shadowed by an
  engine-supplied value with no diagnostic anywhere. The pattern is what
  keeps those names addressable at all. The write side follows the read
  side's key rules deliberately rather than inventing its own: an author
  who learned the shape on a read would otherwise meet a different, silent
  contract on a write.
status: active
superseded_by: null
