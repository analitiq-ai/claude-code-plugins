id: RULE-ENDP-029
statement: >
  A write response's metadata key MUST match the contract's metadata-key
  pattern and MUST NOT collide with a reserved response-scope name.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::WriteResponse._metadata_keys"
owners: [connector-plugin, engine]
targets: [WriteResponse]
fields: [metadata]
mechanism: pattern
symbol: "analitiq.contracts.endpoints::METADATA_KEY_PATTERN"
rationale: >
  A metadata key is declared as an addressable name in the response scope,
  and one that collides with a reserved response-scope name would give one
  reference two meanings — which is why the reserved set and the key
  pattern are graded where the document is read, at validation. The pinned
  contract-consumption manifest claims no read of the metadata, and it has
  no effect on a run today; the pattern is what keeps the names
  addressable wherever the block is read. The write side follows
  the read side's key rules deliberately rather than inventing its own: an
  author who learned the shape on a read would otherwise meet a different,
  silent contract on a write.
status: active
superseded_by: null
