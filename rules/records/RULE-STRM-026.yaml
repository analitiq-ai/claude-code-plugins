id: RULE-STRM-026
statement: >
  A filter on an API source MUST name a record field the referenced endpoint
  offers for filtering, and an operator that field gives a landing site.
tier: referential
severity: error
scopes: [stream]
validator: null
owners: [pipeline-plugin, engine]
targets: [Filter]
rationale: >
  Which fields an API endpoint offers, and where each operator on them reaches
  the wire, is declared in the api-endpoint document; the stream carries no view
  of it, so the local check can prove only that an operator is in the API
  vocabulary at all. Two failures hide here and look alike: a field the endpoint
  offers but not with this operator, and a field it does not offer at all. Either
  one is a filter with no landing site, which is a predicate the request cannot
  express — catching it means reading the endpoint's map beside the filter.
status: active
superseded_by: null
