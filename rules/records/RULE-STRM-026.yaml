id: RULE-STRM-026
statement: >
  A filter on an API source MUST name a field with an entry for that operator
  in the referenced endpoint's read operation `filters` map.
tier: referential
severity: error
scopes: [stream]
validator: null
owners: [pipeline-plugin, engine]
targets: [Filter]
rationale: >
  The `filters` map lives on the endpoint document, which is not part of the
  stream, so no in-process check can compare a stream's filter against it —
  a connector-scoped (API) endpoint document is never carried by the
  pipeline bundle the local validator resolves against, only
  connection-scoped ones are — and resolution happens server-side when the
  stream is saved. Two failures hide behind one string until then: a field
  the map does not carry at all, and a field the map carries with no entry
  for this operator, which is a parameter the runtime owns (RULE-ENDP-002)
  or an operator the map simply never declared for that field.
status: active
superseded_by: null
