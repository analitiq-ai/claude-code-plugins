id: RULE-STRM-026
statement: >
  A filter on an API source MUST name a field with an entry for that operator
  in the referenced endpoint's read operation `filters` map.
tier: reference
severity: error
artifact_kinds: [stream]
validator: null
enforcement_location: unenforced
owners: [pipeline-plugin, engine]
targets: [Filter]
rationale: >
  The `filters` map lives on the endpoint document, not on the stream. A
  workspace request carries both, and the workspace check resolving a
  connector-scoped reference reads the endpoint document, but no check
  compares a filter against its `filters` map. The engine narrows only half of what this rule
  requires, at read-plan time: it refuses a filter naming a field with no
  params-map entry at all, but that lookup is keyed on field name alone, with
  no operator dimension, so a field declared for one operator and filtered
  with a different one passes identically to a genuine match and goes out on
  the wire as whatever the provider does with an operator it never declared
  support for — a parameter the runtime owns (RULE-ENDP-002) or an operator
  the map simply never declared for that field.
status: active
superseded_by: null
