id: RULE-STRM-026
statement: >
  A filter on an API source MUST name a field the referenced endpoint offers
  filtering on, with an operator that endpoint binds for that field.
tier: referential
severity: error
scopes: [stream]
validator: null
owners: [pipeline-plugin, engine]
targets: [Filter]
rationale: >
  Which fields are filterable, and which operators reach the wire on each, is
  declared per field in the api-endpoint document's read `filters` map, and the
  stream carries no view of it — so the local check proves only that an operator
  is in the API vocabulary at all. Nor can the offline bundle close it: an
  assembled run carries endpoint identity only, and a connector-scoped endpoint
  not even that — it is resolved from the connector's own endpoint set, which
  the bundle does not carry. Nothing else performs the comparison either, so
  two failures hide here and look alike until a reader makes it: a field the
  endpoint offers but not under this operator, and a field it does not offer at
  all. What the map does close without seeing the stream is the ambiguity
  underneath: an operator that reaches no binding cannot be authored, so an
  operator a stream sends can no longer be one the endpoint had no way to
  express.
status: active
superseded_by: null
