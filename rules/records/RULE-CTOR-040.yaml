id: RULE-CTOR-040
statement: >
  A `database` connector MUST declare its `sql_capabilities` block, which the
  contract leaves optional and the engine requires before it will run any
  write mode.
tier: structural
severity: error
scope: connector
mechanized: false
validator: null
owners: [connector-plugin, engine]
targets: [DatabaseConnector]
rationale: >
  The engine reads the declaration instead of probing the live database, so
  an absent block is not a request for defaults — every write mode is refused
  at handshake, and the connector reads as finished right up until someone
  tries to write through it. The field is deliberately optional on
  `DatabaseConnector` so a partial document still validates, and the refusal
  happens against a live system this repo never sees.
status: active
superseded_by: null
