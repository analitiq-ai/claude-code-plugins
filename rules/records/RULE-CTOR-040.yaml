id: RULE-CTOR-040
statement: >
  A `database` connector that supports writing MUST declare its
  `sql_capabilities` block, which the contract leaves optional.
tier: shape
severity: error
scopes: [connector]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, engine]
targets: [DatabaseConnector]
rationale: >
  The engine reads the declaration instead of probing the live database, so
  an absent block is not a request for defaults, and the connector reads as
  finished right up until someone tries to write through it. The field is
  deliberately optional on `DatabaseConnector` so a partial document still
  validates. Known enforcement gap: no located engine mechanism refuses every
  write mode outright for a connector shipping no `sql_capabilities` at all —
  the class-level role checks that exist grade the CDK's own kind-default
  classes at class-definition time, not a per-connector declaration this
  document carries, so what actually happens against a live system this repo
  never sees is not confirmed.
status: active
superseded_by: null
