id: RULE-CTOR-040
statement: >
  A `database` connector MUST declare its `sql_capabilities` block, which the
  contract leaves optional.
tier: shape
severity: error
scopes: [connector]
validator: null
enforcement_location: engine
owners: [connector-plugin, engine]
targets: [DatabaseConnector]
rationale: >
  The engine reads the declaration instead of probing the live database, so
  an absent block is not a request for defaults, and the connector reads as
  finished right up until someone tries to write through it. The field is
  deliberately optional on `DatabaseConnector` so a partial document still
  validates. The engine's schema-handshake path checks the parsed
  capabilities before any write RPC, for every write mode, and raises a
  schema-configuration error when none were declared — a write-capable
  connector shipping no `sql_capabilities` fails loudly and deterministically
  at handshake time, never silently at the write itself.
status: active
superseded_by: null
