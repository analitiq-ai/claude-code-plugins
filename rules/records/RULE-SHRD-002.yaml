id: RULE-SHRD-002
statement: >
  A temporal field's declared Arrow type MUST carry a zone only when a real
  wire sample carries one, and a date-time MUST NOT be defaulted to
  zone-aware.
tier: judgment
severity: error
scopes: [any]
validator: null
owners: [connector-plugin, pipeline-plugin]
rationale: >
  The zoned and the zoneless spelling are alike canonical Arrow types the
  engine grammar admits, so the declaration validates whichever it claims and
  only the provider's actual wire value decides which claim is true. The
  common error is assuming zone-awareness because a field is named like an
  instant, which reinterprets every value the provider sends and shifts it by
  the destination's offset, silently and uniformly enough that nobody reads it
  as corruption. An api-endpoint may record that wire value beside the
  declaration, and where one does RULE-ENDP-063 grades the pair; elsewhere
  catching a wrong call means going back to a captured sample response.
status: active
superseded_by: null
