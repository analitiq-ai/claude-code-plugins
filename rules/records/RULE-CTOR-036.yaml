id: RULE-CTOR-036
statement: >
  A `resource_discovery.strategy` MUST name a strategy the engine has
  registered, unless the connector ships that strategy itself through its
  own `connector_plugin` implementation.
tier: reference
severity: error
scopes: [connector]
validator: null
enforcement_location: unenforced
owners: [connector-plugin, engine]
targets: [ResourceDiscovery]
rationale: >
  Naming a strategy and shipping one are separate edits in separate files,
  so the pair drifts easily: an author who renames the entry-point class, or
  who copies a strategy id from a connector whose package they did not copy,
  leaves a document that validates. `strategy` is an open string here, so an
  unregistered id passes every check this repo runs. Known enforcement gap:
  the engine's SQL discovery path implements schema/table/column discovery
  directly, with no `resource_discovery`-strategy registry anywhere in its
  source, so an unregistered id is not merely uninspected by anything here —
  nothing located in the engine reads this field either.
status: active
superseded_by: null
