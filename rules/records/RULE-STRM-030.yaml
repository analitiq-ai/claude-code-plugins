id: RULE-STRM-030
statement: >
  A stream MUST declare source primary keys when the transfer needs record
  identity and the source endpoint carries no primary-key metadata of its
  own, and MUST NOT declare keys that contradict the endpoint's.
tier: reference
severity: error
scopes: [stream]
validator: null
enforcement_location: unenforced
owners: [pipeline-plugin, engine]
targets: [StreamSource]
rationale: >
  The field is a fallback identity hint, and both halves of the condition
  are outside the stream: the endpoint's own primary-key metadata sits in a
  document the stream only references, and whether identity is needed at all
  is decided by the destination's write mode in a third one. Declared
  against an endpoint that already carries keys, it is a second source of
  truth for record identity that can disagree; omitted where an API source
  feeds a conflict-resolving write, it leaves the transfer with no identity
  at all, since an API endpoint document has none to inherit. Neither half
  is refused anywhere: the engine reads `primary_keys` as a plain optional
  list and falls back to a synthetic whole-record hash when it is empty, on
  both the read and the write side, so an omission that needed real identity
  does not fail the run — it silently derives a weaker one. Catching either
  means reading the source endpoint and the destination's write mode
  together.
status: active
superseded_by: null
