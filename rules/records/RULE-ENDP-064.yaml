id: RULE-ENDP-064
statement: >
  An embedded request or response schema MUST NOT declare `$schema` on a
  subschema; the dialect is declared on the schema itself, or not at all.
tier: structural
severity: error
scopes: [api-endpoint]
validator: "analitiq.contracts.endpoints::ResponseExtraction._validate"
owners: [connector-plugin, engine]
targets: [ResponseExtraction, WriteInput]
rationale: >
  `$schema` belongs to a schema resource, and an embedded schema is one
  resource — the document under `response.schema` or `input.schema`. A JSON
  Schema implementation grading a node honours the declaration that node
  carries, so a subschema naming another draft is graded in that draft while
  everything around it is graded in the draft this contract is written in: the
  keywords beneath it keep their spelling and lose their meaning, a value that
  should fail passes, and nothing reports it. It is the harm a nested base-URI
  declaration does, arriving through a keyword that reads as documentation
  rather than as a reference. Refusing it on the document leaves every consumer
  a single declaration to read — the root one — which is what lets a dialect
  comparison be a comparison of one value rather than a walk of its own, and
  what makes the contract's own draft the one an offline reader of any
  subschema is entitled to assume. Declaring the dialect at the root stays
  authorable, and omitting it stays authorable too.
status: active
superseded_by: null
