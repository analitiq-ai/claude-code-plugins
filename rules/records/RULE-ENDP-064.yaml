id: RULE-ENDP-064
statement: >
  Every entry a node of an endpoint's response or write-input schema records
  under `examples` MUST satisfy that node's own declarations, unless the node
  is reached through a position whose subschema does not describe the instance
  — `not`, which says what the instance must not be, and `if`, which selects a
  branch rather than constraining. A sample recorded at one of those is not a
  value the declaration beside it claims to describe.
tier: advisory
severity: error
scopes: [api-endpoint]
validator: "analitiq.validator.connectors::_sample_findings"
owners: [connector-plugin, engine]
targets: [ResponseExtraction, WriteInput]
rationale: >
  A recorded sample is the wire evidence the field's declaration was decided
  from, so a node that rejects its own sample is a declaration its own evidence
  contradicts — and a check comparing declarations to each other cannot see it.
  That is the shape a connector takes when a provider's documented type and its
  documented example disagree: with no sample recorded the endpoint is
  internally consistent, the type map resolves the token it was told about, and
  what the provider actually sends is described nowhere. The draft this
  contract is written in states that an `examples` entry need not validate;
  this contract requires it, because an example nobody grades is the same
  unfalsifiable claim the sample was recorded to remove. Graded in the
  validator rather than the models because deciding an instance against a
  schema is a JSON Schema implementation's job, and the contract package is
  deliberately too dependency-light to host one.
status: active
superseded_by: null
