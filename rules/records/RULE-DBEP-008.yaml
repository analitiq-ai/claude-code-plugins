id: RULE-DBEP-008
statement: >
  An authored endpoint MUST NOT declare a column the engine synthesises when it
  creates a table, and MUST drop such a column from a mirrored source's column
  list.
tier: procedural
severity: error
scope: database-endpoint
validator: null
owners: [pipeline-plugin, engine]
targets: [Column, DatabaseEndpointDoc]
rationale: >
  The engine adds its own bookkeeping columns to any table it creates, so
  declaring one puts the same column in the DDL twice and the first run fails
  at table creation. The trap is the mirror case: a source table the engine
  itself created carries those columns as ordinary discovered columns, so
  copying the source's list forward reproduces them without anyone deciding to.
  The synthetic names belong to the engine rather than to the contract, and the
  column model accepts any non-empty name, so nothing in the document can
  recognise them — the collision appears when the table is created.
status: active
superseded_by: null
