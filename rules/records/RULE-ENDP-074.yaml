id: RULE-ENDP-074
statement: >
  Every replication cursor field MUST resolve to a record-shape node whose own
  `type` names exactly one JSON type besides `null`, and that type MUST be one
  that can hold a cursor: a string moment or an integer.
tier: coherence
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fixture_model: ReadOperation
rationale: >
  The stored cursor is the last record's value for this field, and as the
  engine reads it today, the field's own `type` is what says how that value
  reads back on the next run: a string as an ISO moment, an integer as epoch
  ticks or a monotonic id. A field whose `type` names no real type or a union
  of them gives the reader nothing to choose, and the engine refuses it
  before the first request. A number, boolean or container field is worse: it
  is refused only when a stored cursor is read back, after the first run has
  read everything and committed a checkpoint the stream can never resume
  from. The reading is the field node's own `type` key and no deeper —
  `declared_json_types` in the engine's response-schema reader takes
  `field["type"]` and does not descend a union — so a field typed only
  through `anyOf`/`oneOf`, through a `$ref` or an `allOf`, or only by a
  `native_type`/`arrow_type` pair, is refused here for the same reason: it satisfies the typedness rule other
  paths ask about and still names no JSON type the cursor reader can see.
  The same holds for a type reached through a `$ref` or an `allOf`: those
  resolve for the typedness rule the path check asks, and the cursor reader
  resolves neither, because `records_items_schema` walks `properties` and
  follows no pointer. Reading any of them through would be the worse error of
  the two available: it would bless the spellings that validate clean, ship,
  and then die on the first cursor read. The predicate also stands on the contract alone: a
  watermark whose type the document leaves open cannot be compared, whatever
  reads it.
status: active
superseded_by: null
