id: RULE-ENDP-074
statement: >
  Every replication cursor field MUST be declared as a plain key under the
  record shape's `properties`, on a node whose own `type` names exactly one
  JSON type besides `null`, and that type MUST be one that can hold a cursor:
  a string moment or an integer.
tier: coherence
severity: error
artifact_kinds: [api-endpoint]
validator: "analitiq.contracts.endpoints::ReadOperation._wiring"
owners: [connector-plugin, engine]
targets: [ReadOperation]
fixture_model: ReadOperation
rationale: >
  The stored cursor is the last record's value for this field, and as the
  engine reads it today, the field's own `type` is what says how that value
  reads back on the next run: a string as an ISO moment, an integer as epoch
  ticks or a monotonic id. A field whose `type` names no real type or a union
  of them gives the reader nothing to choose, and the engine refuses it
  before the first request. A number, boolean or container field is worse: it
  is refused only when a stored cursor is read back, after the first run has
  read everything and committed a checkpoint the stream can never resume
  from. The reading is the field node's own `type` key and no deeper —
  `declared_json_types` in the engine's response-schema reader takes
  `field["type"]` and descends nothing, not a union, not a `$ref`, not an
  `allOf` — so a field typed only through one of those, or only by a
  `native_type`/`arrow_type` pair, is refused here for the same reason: it
  satisfies the typedness rule other paths ask about and still names no JSON
  type the cursor reader can see. Reading any of them through would be the
  worse error of the two available: it would bless spellings the engine
  cannot read at all. A field it sees no type on earns no Arrow type either,
  so the read fails as the endpoint is prepared, under every replication
  method; where the author also writes a `native_type`/`arrow_type` pair the
  document survives that far and fails at the cursor reader instead.
  Where the field is looked up is part of the same reading. The engine takes
  one flat lookup keyed by the whole cursor field name, so a dotted path is
  not walked: it matches no key, and the read fails when the endpoint is
  prepared, before the first request. Refusing it at authoring time moves
  that failure to where the author can see it. The lookup does not merge
  either — a field the record shape declares itself is read as that
  declaration, whatever a `$ref` base or an `allOf` branch alongside also
  says about it. So such a shape is accepted, because refusing it would be
  over-refusal, which fails parity the same way over-acceptance does; but the
  branch is not read for this field at all, so a `format` it adds to a `type`
  on the shape is invisible to both readers, and the cursor field must carry
  its own `type` and `format`. It also means a field contributed ONLY by a `$ref`
  base or an `allOf` branch, beside a record shape that has `properties` of
  its own, is refused: the engine reads that own map and no other, so the
  field it names is not there. The record SHAPE, unlike the field, is
  resolved: a shape assembled from a `$ref` or an `allOf` is followed, and
  the field found through it keeps its own `$ref` unresolved. That is a
  deliberate
  difference from the engine, which resolves neither and refuses such a
  document when it reads the record schema. It is kept because RULE-ENDP-026
  tells authors to put a non-local schema in this document's `$defs`, and
  refusing the shape that rule steers them into would make the two rules
  contradict each other. The gap it leaves is real and belongs to the engine:
  until the engine resolves the record shape, a document written this way is
  accepted here and refused there.
  The predicate also stands on the contract alone: a watermark whose type the
  document leaves open cannot be compared, whatever reads it.
status: active
superseded_by: null
