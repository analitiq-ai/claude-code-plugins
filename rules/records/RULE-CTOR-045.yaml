id: RULE-CTOR-045
statement: >
  A connector's slug MUST name the same entity in its document, its registry
  repository and its on-disk directory, and MUST NOT change — rewriting a
  `connector_id`, or a derived `endpoint_id`, mints a different entity rather
  than editing this one.
tier: referential
severity: error
scope: connector
mechanized: false
validator: null
owners: [connector-plugin, pipeline-plugin, engine]
rationale: >
  Every stored reference to a connector is that slug — connections,
  pipelines and the streams bound to its endpoints all hold it — so an edit
  that reads as a rename is a delete plus a create, and nothing pointing at
  the old slug follows. The identity spans a document field, a remote
  repository name and a filesystem path, and immutability is a property
  across successive versions of a document rather than of any one instance a
  validator sees.
status: active
superseded_by: null
