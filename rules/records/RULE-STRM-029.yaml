id: RULE-STRM-029
statement: >
  A stream source MUST declare a replication policy unless the referenced
  source endpoint supports full refresh.
tier: reference
severity: error
scopes: [stream]
validator: null
enforcement_location: engine
owners: [pipeline-plugin, engine]
targets: [StreamSource]
rationale: >
  Omitting the block is a policy choice, not an absence: it falls back to
  reading everything each run, which only a source that supports full
  refresh can do. Endpoint capability is invisible to the stream document,
  so the correctness of the default is decided by an artifact the model
  cannot read, and this is the one case a database source cannot violate —
  every database read is treated as capable of full refresh, with no
  declared vocabulary to fail against. Where it is violable, on an API
  source, the engine's read-plan check closes it deliberately: an omitted
  block folds into the same `full_refresh` default an explicit selection
  would produce, before the same `supported_methods` guard `RULE-STRM-025`
  names runs against it, precisely so the one stream shape that skips
  authoring a method is not the one shape that skips the check.
status: active
superseded_by: null
