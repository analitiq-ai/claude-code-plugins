id: RULE-PKG-030
statement: >
  A connector whose `kind` resolves types MUST ship a sibling `type-map.json`
  carrying a rule list for each direction its `kind` calls for and none for a
  direction it does not; no connector ships any other `type-map-*.json` beside
  it.
tier: reference
severity: error
artifact_kinds: [connector-package]
validator: "analitiq.validator.connectors::check_coverage"
owners: [connector-plugin, engine]
rationale: >
  The map is a separate document from `connector.json`, so nothing about the
  connector document is wrong when a direction is missing — the connector simply
  has no type vocabulary for that direction, and the failure arrives at the first
  stream that resolves a column instead of at authoring. Carrying a spare
  direction is the same defect wearing the opposite sign: a direction the
  connector never renders reads as a capability, and the rules in it are graded
  by nobody and trusted by the next author.

  A direction is the key its rules sit under, so one document holds every
  direction and nothing counts or disambiguates files. A second name that reads
  as a type map is refused rather than ignored: its rules are graded by nothing
  here, beside a package that looks as though it ships them. The names are facts
  about the package rather than about the document, so they are graded here,
  where the package is in hand, and a map handed to the validator on its own is
  graded on its sections alone.
status: active
superseded_by: null
