id: RULE-PKG-030
statement: >
  A connector MUST ship a sibling type-map document declaring each direction its
  `kind` calls for, at most one document per direction, and MUST NOT ship one
  declaring a direction its kind has no use for.
tier: reference
severity: error
artifact_kinds: [connector-package]
validator: "analitiq.validator.connectors::check_coverage"
owners: [connector-plugin, engine]
rationale: >
  The maps are separate documents from `connector.json`, so nothing about the
  connector document is wrong when one is missing — the connector simply has no
  type vocabulary for that direction, and the failure arrives at the first stream
  that resolves a column instead of at authoring. Shipping a spare map is the
  same defect wearing the opposite sign: a direction the connector never renders
  reads as a capability, and the rules in it are graded by nobody and trusted by
  the next author.

  Which directions a package covers is counted from what its documents declare,
  never from what they are named. Read of the engine as it stands: it collects a
  connector's and a connection's type maps by pattern, keys each one by the
  `direction` in its body, and never inspects the filename — so a package whose
  documents declare one direction twice has no unambiguous document for any
  direction, and loading stops before a column is read. Counting filenames
  instead would pass that package and fail one the engine loads correctly. The
  count is right whichever way that reading goes stale: one document per
  required direction is what a consumer needs however it finds them, and a
  filename a consumer never reads cannot make a second document for one
  direction unambiguous. The pattern the documents are collected by is the half
  of that reading a stale copy does break: it is stated on both sides and
  pinned by neither, so a pattern that widens or narrows on the engine's side
  leaves this check grading a set of files the engine does not load, and nothing
  here goes red — a map that stops being found where it was authored is the
  signal to re-read it from the engine.

  The pre-split single-map filename is rejected outright rather than read as a
  read map. It matches no pattern either side collects by, so there is nothing
  to count it toward, and a connector that still carries it has a write
  direction nobody has looked at. That name is a fact about the
  package rather than about the document under it, so it is graded here,
  where the package is in hand, and a map handed to the validator on its own
  is graded on the direction it declares.
status: active
superseded_by: null
