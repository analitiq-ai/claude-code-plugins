id: RULE-PKG-016
statement: >
  A database connector's dialect MUST implement exactly the hooks its
  `sql_capabilities` declaration obliges, so a declared fact with no hook
  behind it and a hook nothing routes to are both violations.
tier: referential
severity: error
scopes: [connector-package]
validator: null
owners: [connector-plugin, engine]
rationale: >
  The engine refuses rather than guesses: it reads the declaration instead
  of probing the live database, and refuses a write mode at handshake when
  the fact it needs was not declared. So an undeclared capability disables
  a write path the connector can actually perform, while a declared one
  with no hook fails at handshake — and a hook nothing routes to is dead
  code standing in for a declaration the author forgot. The declaration is
  JSON this repo validates and the hooks are Python it never sees, so only
  the CDK conformance kit at registry CI compares them, after the connector
  has validated clean here.
status: active
superseded_by: null
