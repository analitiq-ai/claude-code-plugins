id: RULE-SHRD-010
statement: >
  An inherited header MUST be dropped with `headers_remove`; declaring the
  header with a value that resolves to null or empty is not a deletion.
tier: shape
severity: error
artifact_kinds: [any]
validator: "analitiq.contracts.shared.rules::HeaderMergeRules._headers_no_null_or_empty_value"
owners: [connector-plugin, pipeline-plugin, engine]
targets: [HttpTransport, TransportDefaults, _RequestBase, AuthOperationTemplate]
rationale: >
  The header merge resolves each layer's value and skips overriding when the
  resolved value is null, so a null-valued header leaves whatever an earlier
  layer already set in place rather than clearing it — not a deletion. An
  empty-string value does override and reaches the wire as an empty header,
  which on an inherited auth header is a rejected request rather than an
  inherited default that went away. The removal list is the only spelling
  that states the intent where the resolution order can act on it.
status: active
superseded_by: null
