id: RULE-STRM-018
statement: >
  A connection-scoped endpoint reference SHOULD carry the derived
  endpoint_id whenever the author can compute it, so the cross-document
  bundle check can resolve the reference.
tier: judgment
severity: warning
scope: stream
validator: null
owners: [pipeline-plugin]
rationale: >
  The contract derives the handle when it is omitted and verifies it when it
  is supplied, so both authorings are valid documents and only the bundle
  check notices the difference: with the handle present the reference is
  resolved against a bundled endpoint document, without it the resolution is
  simply not attempted. Omitting it is therefore a coverage gap rather than
  a defect, and stays legitimate where the derivation inputs are not in hand
  — a ref handed over by discovery is submitted as it stands rather than
  re-derived. To catch a violation someone must read the ref beside the
  endpoint document it was built from; nothing in this repo pairs them.
status: active
superseded_by: null
