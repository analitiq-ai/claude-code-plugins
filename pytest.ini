[pytest]
addopts = --strict-markers
# Both roots, explicitly. Each tests/<name>/ is the suite for the surface
# named <name> — a plugin's own authoring suite when <name> names a plugin,
# the suite for that repo-level surface otherwise; each package keeps its own
# suite beside it. The rule is what ships: plugins/ is copied verbatim into
# every user's plugin cache, so test baggage there is dead weight, whereas a
# package build stages only src/ + pyproject/README/LICENSE and never carries
# tests into the wheel.
#
# Naming `packages` here is load-bearing, not decorative — dropping it would
# silently stop collecting every package's own test suite (packages/*/tests/)
# and the suite for scripts that live directly under packages/ (packages/tests/)
# while still exiting 0.
testpaths = tests packages
